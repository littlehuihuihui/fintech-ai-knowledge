      "children": [
        {
          "id": "sql-window-rank",
          "title": "排名类",
          "level": "??",
          "content": "### 排名类窗口\n\nROW_NUMBER / RANK / DENSE_RANK。",
          "children": [
            {
              "id": "sql-row-number",
              "title": "ROW_NUMBER",
              "level": "??",
              "content": "### ?? 是什么\n\n- **一句话定义**：按排序为分区内每一行生成唯一连续序号。\n- **核心语法结构图**：\n\n```sql\nROW_NUMBER() OVER (\n  [PARTITION BY 分组列...]\n  ORDER BY 排序列 [ASC|DESC]...\n)\n```\n\n### ?? 怎么写\n\n可复制模板（MySQL 8.0+ / DuckDB 均可直接运行）：\n\n```sql\n-- 1) 准备示例表\nCREATE TEMPORARY TABLE orders_demo (\n  order_id   INT,\n  user_id    INT,\n  amount     DECIMAL(10,2),\n  created_at TIMESTAMP\n);\n\nINSERT INTO orders_demo VALUES\n  (101, 1, 80.00,  '2024-01-01 10:00:00'),\n  (102, 1, 120.00, '2024-01-02 11:00:00'),\n  (103, 1, 120.00, '2024-01-03 09:00:00'),  -- 与上一单金额并列\n  (104, 2, 50.00,  '2024-01-01 12:00:00'),\n  (105, 2, 90.00,  '2024-01-04 08:00:00');\n\n-- 2) 每个用户按金额降序、时间升序编号（并列也保证唯一）\nSELECT\n  order_id,\n  user_id,\n  amount,\n  created_at,\n  ROW_NUMBER() OVER (\n    PARTITION BY user_id          -- 每个用户单独编号\n    ORDER BY amount DESC,         -- 金额高者靠前\n             created_at ASC       -- 金额相同时，更早的订单靠前\n  ) AS rn\nFROM orders_demo\nORDER BY user_id, rn;\n```\n\n**输入表 `orders_demo`：**\n\n| order_id | user_id | amount | created_at |\n|---:|---:|---:|---|\n| 101 | 1 | 80.00 | 2024-01-01 10:00:00 |\n| 102 | 1 | 120.00 | 2024-01-02 11:00:00 |\n| 103 | 1 | 120.00 | 2024-01-03 09:00:00 |\n| 104 | 2 | 50.00 | 2024-01-01 12:00:00 |\n| 105 | 2 | 90.00 | 2024-01-04 08:00:00 |\n\n**查询结果示例：**\n\n| order_id | user_id | amount | rn | 说明 |\n|---:|---:|---:|---:|---|\n| 102 | 1 | 120.00 | 1 | 金额最高；与 103 并列时因时间更早得 1 |\n| 103 | 1 | 120.00 | 2 | 并列金额，序号仍连续且唯一 |\n| 101 | 1 | 80.00 | 3 | |\n| 105 | 2 | 90.00 | 1 | 用户 2 重新从 1 起编 |\n| 104 | 2 | 50.00 | 2 | |\n\n### ?? 用在哪\n\n**场景 1：每用户 Top-N 订单（去重取样）**\n\n- **场景描述**：运营要「每个用户金额最高的 2 笔订单」做召回样本，要求行不重复、口径稳定。\n- **SQL 片段**：\n\n```sql\nSELECT *\nFROM (\n  SELECT\n    o.*,\n    ROW_NUMBER() OVER (\n      PARTITION BY user_id\n      ORDER BY amount DESC, order_id ASC\n    ) AS rn\n  FROM orders_demo o\n) t\nWHERE rn <= 2;\n```\n\n- **为什么用 ROW_NUMBER 而非 RANK**：`RANK` 在金额并列时会给出相同名次，过滤 `rank<=2` 可能取出超过 2 行；`ROW_NUMBER` 强制唯一序号，Top-N 行数可控。\n\n**场景 2：明细去重——保留最新一条**\n\n- **场景描述**：同一 `order_id` 因重放出现多条变更日志，分析只要最新快照。\n- **SQL 片段**：\n\n```sql\nCREATE TEMPORARY TABLE order_events (\n  order_id INT,\n  status   VARCHAR(16),\n  updated_at TIMESTAMP\n);\nINSERT INTO order_events VALUES\n  (101, 'created', '2024-01-01 10:00:00'),\n  (101, 'paid',    '2024-01-01 10:05:00'),\n  (101, 'paid',    '2024-01-01 10:05:00'); -- 重复事件\n\nSELECT order_id, status, updated_at\nFROM (\n  SELECT\n    e.*,\n    ROW_NUMBER() OVER (\n      PARTITION BY order_id\n      ORDER BY updated_at DESC, status DESC\n    ) AS rn\n  FROM order_events e\n) t\nWHERE rn = 1;\n```\n\n- **为什么用 ROW_NUMBER 而非 DENSE_RANK**：去重要「恰好一行」；`DENSE_RANK` 在排序键完全相同时仍可能并列并列值，无法用 `=1` 稳定压成单行（除非排序键能严格区分）。`ROW_NUMBER` 即使排序键相同也会任意但确定地保留一行。\n\n### ?? 注意啥\n\n- **性能陷阱**：`ROW_NUMBER` 需要对每个分区做排序。大表上 `PARTITION BY` 高基数列 + 宽 `ORDER BY` 会触发大量内存/磁盘排序。实务建议：① 先 `WHERE` 缩小集合再窗口；② 分区键、排序键尽量有索引支撑（视引擎）；③ Top-N 可考虑引擎专用语法（如部分库的 `QUALIFY`）或预聚合表。\n- **与其他函数的区别**：\n\n| 函数 | 并列值（金额相同） | 名次是否连续 | 典型用途 |\n|---|---|---|---|\n| ROW_NUMBER | 强制不同序号（1,2,3…） | 是 | Top-N、去重留一行 |\n| RANK | 同名次，下一值跳号（1,1,3） | 否 | 「并列第 1，下一名第 3」的竞赛排名 |\n| DENSE_RANK | 同名次，下一值不跳号（1,1,2） | 是 | 需要并列但不跳号的层级 |\n\n- **面试高频追问**\n\n**Q1：`ORDER BY` 键完全相同，`ROW_NUMBER` 谁先谁后？**  \nA：标准不保证哪一行更靠前，只保证序号唯一。生产环境应追加稳定决胜列（如主键 `order_id`），否则同键重跑结果可能漂移。\n\n**Q2：为什么 `WHERE ROW_NUMBER() OVER(...) = 1` 常报错？**  \nA：窗口函数在 `SELECT` 列表阶段计算，不能直接出现在同一层 `WHERE`。正确写法是子查询/`CTE` 包一层，再过滤 `rn = 1`（或在支持 `QUALIFY` 的引擎里用 `QUALIFY`）。",
              "children": []
            },
            {
              "id": "sql-rank",
              "title": "RANK",
              "level": "??",
              "content": "### 排名类窗口 · 章节导读\n\n**学习目标**：分清 ROW_NUMBER / RANK / DENSE_RANK 的选用。",
              "children": [],
              "lessonParent": true

            {
              "id": "sql-dense-rank",
              "title": "DENSE_RANK",
              "level": "??",
              "content": "### 是什么\n\n- **一句话定义**：并列同名次，但下一值不跳号（1,1,2）。\n- **场景**：需要层级连续、允许并列。\n\n### 怎么写\n\n```sql\nSELECT\n  product_id, score,\n  DENSE_RANK() OVER (ORDER BY score DESC) AS dense_rnk\nFROM product_scores;\n```\n\n### 用在哪\n\n1. **等级分层**：连续档位。\n2. **并列进档**：同分同档且档位紧凑。\n3. **与 RANK 对比讲解**。\n\n### 注意啥\n\n- 仍不能保证「恰好 N 行」。\n- 去重要单行时优先 ROW_NUMBER。\n- 注意分区键是否符合业务口径。",

          "content": "### 分析类 · 章节导读\n\n点绿色叶节点进入讲义：**是什么 / 怎么写 / 用在哪 / 注意啥**。",
          "children": [
            {
              "id": "sql-lag-lead",
              "title": "LAG/LEAD",
              "level": "??",
              "content": "### 是什么\n\n- **一句话定义**：取当前行之前/之后第 N 行的值，常用于环比。\n- **要点**：必须有 `ORDER BY` 定义「前后」。\n\n### 怎么写\n\n```sql\nSELECT\n  dt, gmv,\n  LAG(gmv, 1) OVER (ORDER BY dt) AS gmv_yesterday,\n  gmv - LAG(gmv, 1) OVER (ORDER BY dt) AS dod\nFROM daily_gmv;\n```\n\n### 用在哪\n\n1. **日环比 / 周环比**。\n2. **会话内上一步事件**。\n3. **缺口检测**：与上一状态对比。\n\n### 注意啥\n\n- 分区边界上 `LAG` 为 NULL，需 `COALESCE`。\n- 偏移 N 要与业务粒度一致。\n- 不要在无序集合上使用。",
              "children": []
            },
            {
              "id": "sql-sum-over",
              "title": "SUM OVER",
              "level": "??",
              "content": "### 是什么\n\n- **一句话定义**：在窗口帧内累计求和，保留明细行。\n- **帧**：常用 `ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`。\n\n### 怎么写\n\n```sql\nSELECT\n  dt, gmv,\n  SUM(gmv) OVER (\n    ORDER BY dt\n    ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n  ) AS gmv_cumsum\nFROM daily_gmv;\n```\n\n### 用在哪\n\n1. **累计 GMV / 完成度**。\n2. **分区内累计**：按用户累计消费。\n3. **滚动窗口**：近 N 日求和（改帧）。\n\n### 注意啥\n\n- `RANGE` vs `ROWS` 语义不同，并列值要小心。\n- 大窗口耗内存，先缩小集合。\n- 与 `GROUP BY` 选：要明细就窗口，要折叠就分组。",
              "children": []
            },
            {
              "id": "sql-window-frame",
              "title": "窗口帧ROWS",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：窗口帧（ROWS/RANGE）限定聚合在分区排序后的行范围，如「近 3 行」。\n- **默认**：许多累计函数默认从分区起点到当前行。\n\n### 怎么写\n\n```sql\nSELECT\n  user_id,\n  created_at,\n  amount,\n  SUM(amount) OVER (\n    PARTITION BY user_id\n    ORDER BY created_at\n    ROWS BETWEEN 2 PRECEDING AND CURRENT ROW\n  ) AS amt_last_3_rows,\n  SUM(amount) OVER (\n    PARTITION BY user_id\n    ORDER BY created_at\n    ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n  ) AS running_amt\nFROM orders\nWHERE status = 'paid';\n```\n\n### 用在哪\n\n1. **滑动窗口**：近 N 单金额。\n2. **累计值**：running total。\n3. **去毛刺**：邻域平均。\n\n### 注意啥\n\n- `ROWS` 按物理行，`RANGE` 按值边界，语义不同。\n- 帧写错会导致「整分区」被聚进来。\n- 必须有明确 `ORDER BY` 才谈得上帧。",
              "children": []
            },
            {
              "id": "sql-ntile",
              "title": "NTILE",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：把分区内有序行尽量均匀切成 N 桶，返回桶号 1…N。\n- **场景**：分层抽样、分位粗分（非精确百分位）。\n\n### 怎么写\n\n```sql\nSELECT\n  user_id,\n  gmv,\n  NTILE(4) OVER (ORDER BY gmv DESC) AS gmv_quartile\nFROM (\n  SELECT user_id, SUM(amount) AS gmv\n  FROM orders\n  WHERE status = 'paid'\n  GROUP BY user_id\n) t;\n```\n\n### 用在哪\n\n1. **用户分层**：RFM 粗分四档。\n2. **抽样**：每桶抽固定比例。\n3. **对照实验**：分桶后再随机。\n\n### 注意啥\n\n- 行数不能整除时桶大小可差 1。\n- 需要精确百分位用 `PERCENTILE`/`CUME_DIST` 等。\n- 排序键决定分层含义。",
              "children": []
            },

              "id": "sql-first-value",
              "title": "FIRST_VALUE",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：在窗口帧内取按排序的第一个值；常配 `IGNORE NULLS`（视引擎）。\n- **配对**：`LAST_VALUE` 需小心默认帧。\n\n### 怎么写\n\n```sql\nSELECT\n  user_id,\n  order_id,\n  amount,\n  created_at,\n  FIRST_VALUE(order_id) OVER (\n    PARTITION BY user_id\n    ORDER BY created_at\n    ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING\n  ) AS first_order_id,\n  FIRST_VALUE(amount) OVER (\n    PARTITION BY user_id\n    ORDER BY created_at\n  ) AS first_amount\nFROM orders;\n```\n\n### 用在哪\n\n1. **首单属性**：首次下单渠道/金额。\n2. **会话起点**：会话内第一事件。\n3. **基准对照**：相对首值的变化。\n\n### 注意啥\n\n- `LAST_VALUE` 默认帧只到当前行，常要显式扩帧。\n- 与 `MIN_BY`/`任意值+排序` 方案择优。\n- NULL 是否参与「第一」看引擎选项。",

          "title": "综合练习",
          "level": "??",
          "content": "### 窗口综合练习 · 章节导读\n\n**学习目标**：TopN、去重、环比三类高频题。\n\n**先修**：ROW_NUMBER / LAG。",

            {
              "id": "sql-ex-topn",
              "title": "TopN练习",
              "level": "???",
              "content": "### 是什么\n\n- **题目**：每个用户取支付金额最高的 Top 2 订单（金额相同取更早）。\n- **要求**：结果含 `user_id, order_id, amount, rn`。\n\n### 怎么写\n\n```sql\n-- 题：TopN\n-- 答：\nSELECT user_id, order_id, amount, rn\nFROM (\n  SELECT\n    user_id, order_id, amount,\n    ROW_NUMBER() OVER (\n      PARTITION BY user_id\n      ORDER BY amount DESC, created_at ASC\n    ) AS rn\n  FROM orders\n  WHERE status = 'paid'\n) t\nWHERE rn <= 2\nORDER BY user_id, rn;\n```\n\n### 用在哪\n\n1. **排行榜**：品类 TopN 商品。\n2. **抽样质检**：每组看最大几笔。\n3. **限流展示**：个人主页展示。\n\n### 注意啥\n\n- TopN 必须 `ROW_NUMBER`（或等价），`RANK` 可能超过 N 行。\n- 排序并列规则要写进 `ORDER BY`。\n- 先过滤 `status` 再窗口，减少计算。",
              "children": []

            {
              "id": "sql-ex-dedupe",
              "title": "去重练习",
              "level": "???",
              "content": "### 是什么\n\n- **题目**：`order_events` 按 `event_id` 可能重复，保留 `event_time` 最新一条。\n- **要求**：输出去重后事件明细。\n\n### 怎么写\n\n```sql\n-- 假设表 order_events(event_id, order_id, event_type, event_time, payload)\n-- 题：去重留最新\n-- 答：\nSELECT event_id, order_id, event_type, event_time, payload\nFROM (\n  SELECT\n    e.*,\n    ROW_NUMBER() OVER (\n      PARTITION BY event_id\n      ORDER BY event_time DESC\n    ) AS rn\n  FROM order_events e\n) t\nWHERE rn = 1;\n```\n\n### 用在哪\n\n1. **日志去重**：Exactly-once 近似。\n2. **拉链前清洗**：同一业务键多版本。\n3. **CDC 合并**：保留最新镜像。\n\n### 注意啥\n\n- 分区键=业务去重键，排序键=新旧判定。\n- 大表去重考虑先按日分区再合并。\n- `QUALIFY`（部分仓）可少一层子查询。",
              "children": []

            {
              "id": "sql-ex-dod",
              "title": "环比练习",
              "level": "???",
              "content": "### 是什么\n\n- **题目**：按日汇总支付 GMV，并计算日环比（今日 - 昨日）。\n- **要求**：`dt, gmv, gmv_yesterday, dod`。\n\n### 怎么写\n\n```sql\n-- 题：环比\n-- 答：\nWITH daily AS (\n  SELECT DATE(created_at) AS dt, SUM(amount) AS gmv\n  FROM orders\n  WHERE status = 'paid'\n  GROUP BY DATE(created_at)\n)\nSELECT\n  dt,\n  gmv,\n  LAG(gmv, 1) OVER (ORDER BY dt) AS gmv_yesterday,\n  gmv - LAG(gmv, 1) OVER (ORDER BY dt) AS dod\nFROM daily\nORDER BY dt;\n```\n\n### 用在哪\n\n1. **经营日报**：GMV/订单环比。\n2. **告警**：环比跌破阈值。\n3. **复盘**：活动日对比。\n\n### 注意啥\n\n- 缺日会导致「环比」对到非相邻日，先补日历骨架。\n- 同比用 `LAG(..., 7)` 或日期对齐。\n- 比率环比注意分母为 0。",

          "content": "### WITH写法 · 章节导读\n\n点绿色叶节点进入讲义：**是什么 / 怎么写 / 用在哪 / 注意啥**。",
          "children": [
            {
              "id": "sql-cte-pipeline",
              "title": "CTE流水线",
              "level": "??",
              "content": "### 是什么\n\n- **一句话定义**：`WITH` 命名中间结果，把长 SQL 拆成步骤。\n- **价值**：可读、可测、易复用同层引用（视引擎）。\n\n### 怎么写\n\n```sql\nWITH paid AS (\n  SELECT * FROM orders WHERE status = 'paid'\n),\nuser_gmv AS (\n  SELECT user_id, SUM(amount) AS gmv\n  FROM paid\n  GROUP BY user_id\n)\nSELECT u.email, g.gmv\nFROM user_gmv g\nJOIN users u ON u.user_id = g.user_id\nORDER BY g.gmv DESC\nLIMIT 20;\n```\n\n### 用在哪\n\n1. **复杂报表**：过滤→聚合→关联→排序。\n2. **替代深层嵌套子查询**。\n3. **团队协作**：每步可单独解释。\n\n### 注意啥\n\n- 某些引擎 CTE 物化/内联策略不同，看计划。\n- 递归 CTE 另算，注意终止条件。\n- 步骤不宜过多导致优化器放弃。",

          "content": "### 子查询 · 章节导读\n\n**学习目标**：标量 / EXISTS / 相关子查询及改写意识。\n\n**先修**：JOIN / CTE流水线。",

              "title": "标量子查询",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：子查询返回单个标量，嵌入 `SELECT`/`WHERE` 表达式。\n- **约束**：最多一行一列，否则报错。\n\n### 怎么写\n\n```sql\nSELECT\n  o.order_id,\n  o.amount,\n  (SELECT AVG(amount) FROM orders WHERE status = 'paid') AS global_avg_paid\nFROM orders o\nWHERE o.amount > (\n  SELECT AVG(amount) FROM orders WHERE status = 'paid'\n);\n```\n\n### 用在哪\n\n1. **相对阈值**：高于全局均价的订单。\n2. **打标**：附加一个全局指标列。\n3. **简易校验**：`SELECT (SELECT COUNT(*))`。\n\n### 注意啥\n\n- 相关标量子查询可能变成逐行执行，注意计划。\n- 多行时改 `JOIN`/窗口。\n- 空结果标量为 NULL，注意三值逻辑。",

              "id": "sql-exists-subq",
              "title": "EXISTS子查询",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：用 `EXISTS` 子查询表达半连接过滤（见半开连接主题，此处强调写法套路）。\n- **模式**：外层行驱动，内层相关匹配。\n\n### 怎么写\n\n```sql\nSELECT o.*\nFROM orders o\nWHERE EXISTS (\n  SELECT 1 FROM users u\n  WHERE u.user_id = o.user_id\n    AND u.email LIKE '%@example.com'\n)\nAND o.status = 'paid';\n```\n\n### 用在哪\n\n1. **跨表条件**：订单侧过滤用户属性。\n2. **反连**：`NOT EXISTS` 找孤儿行。\n3. **权限**：仅存在授权记录时可查。\n\n### 注意啥\n\n- 相关列索引是关键。\n- 与 `IN (SELECT id …)` 择优看基数与计划。\n- 避免在子查询内做无谓聚合。",

              "id": "sql-corr-subq",
              "title": "相关子查询",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：子查询引用外层列，对外层每一行（概念上）求值。\n- **利弊**：表达力强，但易写成相关慢查询。\n\n### 怎么写\n\n```sql\nSELECT\n  u.user_id,\n  u.email,\n  (\n    SELECT MAX(o.amount)\n    FROM orders o\n    WHERE o.user_id = u.user_id AND o.status = 'paid'\n  ) AS max_paid_amount\nFROM users u;\n-- 等价窗口/JOIN 聚合往往更快：\n-- SELECT u.*, x.max_paid_amount FROM users u\n-- LEFT JOIN (\n--   SELECT user_id, MAX(amount) max_paid_amount FROM orders\n--   WHERE status='paid' GROUP BY user_id\n-- ) x ON x.user_id = u.user_id;\n```\n\n### 用在哪\n\n1. **按行取关联指标**：每用户最大单。\n2. **教学**：理解相关 vs 非相关。\n3. **小外表**：外表很小时尚可接受。\n\n### 注意啥\n\n- 大外表相关子查询优先改写为 JOIN 聚合。\n- 看 `EXPLAIN` 是否依赖循环执行。\n- 确保相关谓词可索引。",

          "content": "### 递归 · 章节导读\n\n**学习目标**：读懂并写出带护栏的递归 CTE。\n\n**先修**：WITH 流水线。",
          "children": [
            {
              "id": "sql-recursive-cte",
              "title": "递归CTE入门",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：`WITH RECURSIVE` 用锚点 + 递归成员展开层级/图路径，直到不产生新行。\n- **结构**：非递归种子 ∪ 递归步进，需终止条件。\n\n### 怎么写\n\n```sql\n-- 邻接表组织树：id, parent_id, name\nWITH RECURSIVE org AS (\n  SELECT user_id, manager_id, email, 1 AS lvl\n  FROM users\n  WHERE manager_id IS NULL          -- 锚点：根\n  UNION ALL\n  SELECT u.user_id, u.manager_id, u.email, org.lvl + 1\n  FROM users u\n  JOIN org ON u.manager_id = org.user_id\n  WHERE org.lvl < 10                -- 护栏，防环\n)\nSELECT * FROM org ORDER BY lvl, user_id;\n```\n\n### 用在哪\n\n1. **组织树/类目树**。\n2. **账单拆分层级**。\n3. **图可达性**（小规模）。\n\n### 注意啥\n\n- 必须设深度上限或访问集合，防环死循环。\n- 大图递归代价高，考虑闭包表。\n- MySQL 8+ / PG / DuckDB 均支持，语法细节略有差异。",

          "children": [

              "id": "sql-explain",
              "title": "EXPLAIN",
              "level": "??",
              "content": "### 是什么\n\n- **一句话定义**：让引擎说明将如何执行查询（访问路径、连接、排序等）。\n- **目标**：找到全表扫、坏连接顺序、临时表/文件排序。\n\n### 怎么写\n\n```sql\nEXPLAIN\nSELECT *\nFROM orders\nWHERE user_id = 42\n  AND created_at >= '2024-01-01';\n\n-- 部分引擎\nEXPLAIN ANALYZE SELECT ...;\n```\n\n### 用在哪\n\n1. **慢查询诊断**。\n2. **上线前评审**。\n3. **验证索引是否被使用**。\n\n### 注意啥\n\n- 不同引擎输出字段不同，抓关键：type/rows/key/Extra。\n- `EXPLAIN` 是估计；`ANALYZE` 带实际耗时（若支持）。\n- 统计信息过期会导致离谱计划。",
              "children": []

            {
              "id": "sql-composite-index",
              "title": "复合索引",
              "level": "??",
              "content": "### 是什么\n\n- **一句话定义**：多列组成的索引，遵循最左前缀匹配。\n- **设计**：等值列在前，范围列靠后；覆盖常用投影。\n\n### 怎么写\n\n```sql\nCREATE INDEX idx_orders_uid_status_time\nON orders (user_id, status, created_at);\n\n-- 可较好利用：(user_id) / (user_id,status) / 三者都等值或前缀+范围\nSELECT order_id, amount\nFROM orders\nWHERE user_id = 42 AND status = 'paid'\n  AND created_at >= '2024-01-01';\n```\n\n### 用在哪\n\n1. **高频组合过滤**。\n2. **覆盖索引减少回表**。\n3. **对齐 ORDER BY 前缀**。\n\n### 注意啥\n\n- 跳过最左列会导致索引无法完整使用。\n- 列顺序比「感觉上重要」更重要。\n- 用 `EXPLAIN` 验证，不要凭猜测加索引。",
              "children": []

            {
              "id": "sql-index-fail",
              "title": "索引失效",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：谓词写法导致优化器无法有效使用索引（函数包列、隐式转换、前导模糊等）。\n- **对策**：改写条件，保持「列在左侧原样」。\n\n### 怎么写\n\n```sql\n-- 失效示例 → 改写\n-- BAD: 函数包列\n-- WHERE DATE(created_at) = '2024-06-01'\n-- GOOD:\nWHERE created_at >= '2024-06-01'\n  AND created_at <  '2024-06-02';\n\n-- BAD: 类型隐式转换（user_id 为数字却比字符串）\n-- WHERE user_id = '42'\n-- GOOD: WHERE user_id = 42\n\n-- BAD: 前导通配\n-- WHERE email LIKE '%@example.com'\n-- → 难用 btree；可考虑倒排/专用方案\n```\n\n### 用在哪\n\n1. **慢查询治理**：条件改写即加速。\n2. **Code Review**：ORM 生成 SQL 检查。\n3. **培训**：索引可用前提。\n\n### 注意啥\n\n- `OR`、否定、非前缀 `LIKE` 也常破坏范围扫描。\n- 复合索引要满足最左前缀。\n- 用 `EXPLAIN` 验证是否 `ref`/`range`。",
              "children": []

              "id": "sql-covering-index",
              "title": "覆盖索引",

              "content": "### 是什么\n\n- **一句话定义**：索引已包含查询所需全部列，可只扫索引不必回表（Index Only Scan）。\n- **做法**：把过滤列 + 投影列纳入复合索引（权衡写入）。\n\n### 怎么写\n\n```sql\n-- 高频查询：按用户取近期订单号与金额\n-- SELECT order_id, amount FROM orders\n-- WHERE user_id = ? AND status = 'paid'\n-- ORDER BY created_at DESC LIMIT 20;\n\n-- 覆盖倾向索引（示例）\nCREATE INDEX idx_orders_covering\nON orders (user_id, status, created_at, order_id, amount);\n\nEXPLAIN\nSELECT order_id, amount\nFROM orders\nWHERE user_id = 42 AND status = 'paid'\nORDER BY created_at DESC\nLIMIT 20;\n```\n\n### 用在哪\n\n1. **热点列表**：个人订单页。\n2. **计数类**：只读索引列。\n3. **降 IO**：宽表避免回表。\n\n### 注意啥\n\n- 索引过宽损害写入与缓存。\n- 覆盖随 `SELECT` 列表变化，勿盲目加列。\n- 统计信息过期会影响是否选中。",

      "id": "sql-tx-lock",
      "title": "事务与锁",
      "level": "?",
      "content": "### 事务与锁\n\nACID 与显式事务边界。",
      "children": [
        {
          "id": "sql-acid",
          "title": "ACID基础",
          "level": "??",
          "content": "### ACID 入门 · 章节导读\n\n**学习目标**：理解事务边界与提交/回滚。",
          "children": [
            {
              "id": "sql-begin-commit",
              "title": "BEGIN/COMMIT",
              "level": "??",
              "content": "### 是什么\n\n- **一句话定义**：事务把多步读写变成原子单元——全成或全撤。\n- **ACID**：原子性、一致性、隔离性、持久性。\n\n### 怎么写\n\n```sql\nBEGIN;\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nUPDATE accounts SET balance = balance + 100 WHERE id = 2;\nCOMMIT;\n-- 出错则 ROLLBACK;\n```\n\n### 用在哪\n\n1. **转账/库存**：多表必须同成同败。\n2. **批量订正**：可回滚的数据修复。\n3. **读写一致**：报表会话快照（视隔离级别）。\n\n### 注意啥\n\n- 长事务拖锁、拖回收，尽快提交。\n- 隔离级别影响脏读/幻读，按业务选。\n- DDL 在部分引擎会隐式提交。",
              "children": []
            }
          ],
          "lessonParent": true
        },
        {
          "id": "sql-isolation",
          "title": "隔离与并发",
          "level": "??",
          "content": "### 隔离与并发 · 章节导读\n\n**学习目标**：隔离级别与读异常。\n\n**先修**：BEGIN/COMMIT。",
          "children": [
            {
              "id": "sql-isolation-levels",
              "title": "隔离级别",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：事务隔离级别规定并发下「能看到何种中间状态」。\n- **常见四级**：读未提交 → 读已提交 → 可重复读 → 串行化。\n\n### 怎么写\n\n```sql\n-- MySQL\nSET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED;\nSTART TRANSACTION;\nSELECT SUM(amount) FROM orders WHERE user_id = 42;\nCOMMIT;\n\n-- 查看\n-- SELECT @@transaction_isolation;\n```\n\n### 用在哪\n\n1. **报表会话**：倾向快照/可重复读。\n2. **高并发写**：常选读已提交降锁冲突。\n3. **资金强一致**：更高隔离或显式锁。\n\n### 注意啥\n\n- 级别越高并发吞吐通常越低。\n- InnoDB 默认 RR，与 PG 默认 RC 不同。\n- 应用重试与幂等要配套。",
              "children": []
            },
            {
              "id": "sql-anomaly-reads",
              "title": "脏读幻读",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：脏读、不可重复读、幻读是并发读异常的经典分类。\n- **对照**：隔离级别就是为抑制这些异常。\n\n### 怎么写\n\n```sql\n-- 概念演示（两会话，勿在生产随意试）\n-- 会话A: BEGIN; UPDATE orders SET amount = 1 WHERE order_id = 1;  -- 未提交\n-- 会话B: 在 READ UNCOMMITTED 下可能读到 1 → 脏读\n-- 提交/回滚后，RC 下两次读中间被别人改 → 不可重复读\n-- RR/串行化下插入满足条件的新行可见性差异 → 幻读\n\nSELECT order_id, amount FROM orders WHERE order_id = 1;\n```\n\n### 用在哪\n\n1. **故障复盘**：对账不一致归因。\n2. **选型讨论**：业务能否容忍幻读。\n3. **面试/培训**：理论打底。\n\n### 注意啥\n\n- 引擎实现（MVCC/锁）会影响「理论上的」异常是否出现。\n- 不要只调隔离，也要看事务边界长短。\n- 写写冲突另论（丢更新），需乐观锁版本号等。",
              "children": []
            }
          ],
          "lessonParent": true
        },
        {
          "id": "sql-locks",
          "title": "锁",
          "level": "??",
          "content": "### 锁 · 章节导读\n\n**学习目标**：行锁/表锁与死锁重试。\n\n**先修**：事务基础。",
          "children": [
            {
              "id": "sql-row-table-lock",
              "title": "行锁表锁",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：行锁锁住行级记录；表锁锁住整表（或元数据）。\n- **InnoDB**：DML 多为行锁；特定 DDL/操作为表锁。\n\n### 怎么写\n\n```sql\nBEGIN;\n-- 行锁：锁住匹配行（加锁读示例）\nSELECT * FROM orders WHERE order_id = 1001 FOR UPDATE;\nUPDATE orders SET status = 'shipped' WHERE order_id = 1001;\nCOMMIT;\n\n-- 避免：无索引条件的大范围更新导致大量行锁甚至升级\n-- UPDATE orders SET note = 'x' WHERE DATE(created_at) = CURRENT_DATE;\n```\n\n### 用在哪\n\n1. **库存扣减**：对单行 `FOR UPDATE`。\n2. **避免表锁**：批量更新拆批 + 走索引。\n3. **DDL 窗口**：理解表锁影响。\n\n### 注意啥\n\n- 锁粒度越粗，冲突概率越高。\n- 长事务持锁是雪崩温床。\n- 看 `SHOW ENGINE INNODB STATUS` / 性能_schema 定位。",
              "children": []
            },
            {
              "id": "sql-deadlock",
              "title": "死锁重试",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：两个以上事务互相等待对方持有的锁，引擎选择回滚其一。\n- **应用侧**：捕获死锁错误并幂等重试。\n\n### 怎么写\n\n```sql\n-- 预防：统一加锁顺序（先锁 user 再锁 order）\n-- 事务内按主键升序更新多行\nBEGIN;\nUPDATE accounts SET balance = balance - 10 WHERE id = 1;\nUPDATE accounts SET balance = balance + 10 WHERE id = 2;\nCOMMIT;\n\n-- 应用伪代码：catch deadlock → backoff → retry N times\n-- MySQL errno 1213；PG SQLSTATE 40P01\n```\n\n### 用在哪\n\n1. **转账/库存**：多行更新。\n2. **热点商品**：秒杀减库存。\n3. **对账任务**：并发修数。\n\n### 注意啥\n\n- 缩小事务、固定顺序、降隔离或拆分热点。\n- 重试必须幂等，限制次数与抖动。\n- 死锁日志要采集，便于调顺序。",
              "children": []
            }
          ],
          "lessonParent": true
        }
      ]
    },
    {
      "id": "sql-tune",
      "title": "SQL 调优",
      "level": "?",
      "content": "### SQL 调优\n\n复现 → 计划 → 改写 → 回归。",
      "children": [
        {
          "id": "sql-tune-loop",
          "title": "调优闭环",
          "level": "??",
          "content": "### 调优闭环 · 章节导读\n\n点绿色叶节点进入讲义：**是什么 / 怎么写 / 用在哪 / 注意啥**。",
          "children": [
            {
              "id": "sql-tune-checklist",
              "title": "调优检查清单",
              "level": "??",
              "content": "### 是什么\n\n- **一句话定义**：按固定清单缩小慢查询原因，避免盲目加索引。\n- **闭环**：复现 → 计划 → 改写/索引 → 回归验证。\n\n### 怎么写\n\n```sql\n-- 1) 复现并限制代价\nEXPLAIN ANALYZE\nSELECT ...;\n\n-- 2) 先过滤再关联/窗口\nWITH base AS (\n  SELECT * FROM orders\n  WHERE created_at >= CURRENT_DATE - INTERVAL 7 DAY\n)\nSELECT ... FROM base b JOIN ...;\n```\n\n### 用在哪\n\n1. **线上慢查询周报**。\n2. **上线评审**：复杂 SQL 必过清单。\n3. **教学**：把调优步骤标准化。\n\n### 注意啥\n\n- 清单要点：① 过滤是否可推前 ② 是否 JOIN 爆炸 ③ 是否选错索引\n  ④ 是否必要排序/临时表 ⑤ 统计信息是否新鲜 ⑥ 结果粒度是否正确。\n- 先正确后更快；口径错了再快也没用。\n- 改完用同等数据量回归，防「测快线慢」。",
              "children": []
            },
            {
              "id": "sql-rewrite-patterns",
              "title": "常见改写",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：在语义等价前提下改写 SQL，使优化器选更好计划。\n- **常见**：子查询→JOIN、OR→UNION、函数包列→范围、DISTINCT→EXISTS。\n\n### 怎么写\n\n```sql\n-- 相关标量 → JOIN 聚合\n-- BEFORE: SELECT u.*, (SELECT MAX(amount) FROM orders o WHERE o.user_id=u.user_id)\n-- AFTER:\nSELECT u.user_id, u.email, x.max_amt\nFROM users u\nLEFT JOIN (\n  SELECT user_id, MAX(amount) AS max_amt\n  FROM orders GROUP BY user_id\n) x ON x.user_id = u.user_id;\n\n-- OR 两侧难用索引 → UNION ALL 再去重/聚合\n```\n\n### 用在哪\n\n1. **慢查询榜单**第一条手段。\n2. **ORM 生成 SQL**人工改写。\n3. **数仓 SQL**下推过滤。\n\n### 注意啥\n\n- 改写后用同一数据集做结果对比。\n- 以 `EXPLAIN ANALYZE` 验证，不凭感觉。\n- 注意 NULL 与重复行语义是否保持。",
              "children": []
            },
            {
              "id": "sql-partition-prune",
              "title": "分区裁剪",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：分区表上谓词能让引擎只扫相关分区，跳过其它分区数据。\n- **关键**：过滤条件命中分区键且不被函数包裹。\n\n### 怎么写\n\n```sql\n-- 假设 orders 按 RANGE (DATE(created_at)) 或 toYYYYMM 分区（示意）\nSELECT user_id, SUM(amount) AS gmv\nFROM orders\nWHERE created_at >= '2024-06-01'\n  AND created_at <  '2024-07-01'\n  AND status = 'paid'\nGROUP BY user_id;\n\n-- BAD: WHERE DATE(created_at) = '2024-06-15' 可能无法裁剪\n```\n\n### 用在哪\n\n1. **明细大表**：按日/月分区查询。\n2. **生命周期**：冷分区归档。\n3. **仓扫描费**：只扫必要分区降本。\n\n### 注意啥\n\n- 分区键选择要贴合查询模式。\n- 跨太多分区等于几乎不裁剪。\n- 与聚簇/排序键（仓）概念区分。",
              "children": []
            }
          ],
          "lessonParent": true
        },
        {
          "id": "sql-tune-cases",
          "title": "场景案例",
          "level": "??",
          "content": "### 场景案例 · 章节导读\n\n**学习目标**：慢报表与大 JOIN 的排查套路。\n\n**先修**：EXPLAIN / 改写。",
          "children": [
            {
              "id": "sql-slow-report",
              "title": "慢报表案例",
              "level": "???",
              "content": "### 是什么\n\n- **案例**：日报「每用户 GMV + 近 7 日环比」跑数超时。\n- **思路**：预聚合、减少重复扫、窗口一次算完。\n\n### 怎么写\n\n```sql\n-- 优化后形态示意\nWITH daily AS (\n  SELECT user_id, DATE(created_at) AS dt, SUM(amount) AS gmv\n  FROM orders\n  WHERE status = 'paid'\n    AND created_at >= CURRENT_DATE - INTERVAL 14 DAY\n  GROUP BY user_id, DATE(created_at)\n)\nSELECT\n  user_id, dt, gmv,\n  LAG(gmv, 1) OVER (PARTITION BY user_id ORDER BY dt) AS gmv_yday\nFROM daily;\n-- 进一步：落地 daily 汇总表，报表只读汇总\n```\n\n### 用在哪\n\n1. **经营看板**。\n2. **邮件日报**。\n3. **自助分析加速**。\n\n### 注意啥\n\n- 先 EXPLAIN 找全表扫/大排序。\n- 同一明细被扫多次 → CTE/中间表。\n- 报表可接受 T+1 则物化。",
              "children": []
            },
            {
              "id": "sql-big-join",
              "title": "大JOIN案例",
              "level": "???",
              "content": "### 是什么\n\n- **案例**：`orders` 亿级 JOIN `users` + 多维表导致内存/时间爆。\n- **思路**：先过滤事实表、广播小维、避免扇出后再聚合。\n\n### 怎么写\n\n```sql\n-- 先压事实再维表\nWITH o AS (\n  SELECT user_id, amount\n  FROM orders\n  WHERE status = 'paid'\n    AND created_at >= '2024-06-01'\n    AND created_at <  '2024-07-01'\n)\nSELECT u.channel, SUM(o.amount) AS gmv\nFROM o\nJOIN users u ON u.user_id = o.user_id\nGROUP BY u.channel;\n```\n\n### 用在哪\n\n1. **大宽表关联**。\n2. **多维下钻报表**。\n3. **反范式前的临时关联**。\n\n### 注意啥\n\n- 检查 JOIN 键类型一致与空值。\n- 防一对多扇出导致指标放大（先聚合再 JOIN）。\n- 仓上注意 shuffle 与广播选择。",
              "children": []
            }
          ],
          "lessonParent": true
        },
        {
          "id": "sql-warehouse-patterns",
          "title": "数仓SQL模式",
          "level": "??",
          "content": "### 数仓 SQL 模式 · 章节导读\n\n**学习目标**：增量去重与 SCD2 拉链。\n\n**先修**：窗口去重 / UPSERT。",
          "children": [
            {
              "id": "sql-incremental-dedupe",
              "title": "增量去重",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：增量任务只处理新到达数据，并与历史合并去重（常按业务键留最新）。\n- **模式**：增量切片 + `ROW_NUMBER`/`MERGE`/`UPSERT`。\n\n### 怎么写\n\n```sql\n-- 当日增量事件去重后合并入目标（示意）\nWITH inc AS (\n  SELECT *\n  FROM order_events\n  WHERE event_time >= CURRENT_DATE\n    AND event_time <  CURRENT_DATE + INTERVAL 1 DAY\n),\ndedup AS (\n  SELECT * FROM (\n    SELECT i.*, ROW_NUMBER() OVER (\n      PARTITION BY event_id ORDER BY event_time DESC\n    ) rn FROM inc i\n  ) t WHERE rn = 1\n)\nINSERT INTO order_events_curated (\n  event_id, order_id, event_type, event_time, payload\n)\nSELECT event_id, order_id, event_type, event_time, payload FROM dedup\nON DUPLICATE KEY UPDATE\n  event_type = VALUES(event_type),\n  event_time = VALUES(event_time),\n  payload = VALUES(payload);\n```\n\n### 用在哪\n\n1. **近实时入仓**。\n2. **Kafka/CDC 落地**。\n3. **日增量 ETL**。\n\n### 注意啥\n\n- 迟到数据要有回刷窗口。\n- 目标表唯一键必须对齐去重键。\n- 与全量对账定期校验。",
              "children": []
            },
            {
              "id": "sql-scd2",
              "title": "拉链SCD2",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：缓慢变化维 Type 2——保留历史版本，用生效/失效时间拉链。\n- **字段**：`valid_from, valid_to, is_current`。\n\n### 怎么写\n\n```sql\n-- 查询某时刻用户邮箱（拉链）\nSELECT user_id, email\nFROM dim_users_scd2\nWHERE user_id = 42\n  AND valid_from <= '2024-06-15'\n  AND (valid_to IS NULL OR valid_to > '2024-06-15');\n\n-- 关闭旧链 + 插入新版本（示意，需事务）\nUPDATE dim_users_scd2\nSET valid_to = NOW(), is_current = 0\nWHERE user_id = 42 AND is_current = 1;\n\nINSERT INTO dim_users_scd2 (user_id, email, valid_from, valid_to, is_current)\nVALUES (42, 'new@x.com', NOW(), NULL, 1);\n```\n\n### 用在哪\n\n1. **用户属性史**。\n2. **价格/类目变更追溯**。\n3. **点-in-time 分析**。\n\n### 注意啥\n\n- 时间边界半开区间约定要统一。\n- 并发更新需事务，防双 current。\n- 与 SCD1（覆盖）选型按分析需求。",
              "children": []
            }
          ],
          "lessonParent": true
        },
        {
          "id": "sql-security",
          "title": "安全",
          "level": "??",
          "content": "### 安全 · 章节导读\n\n**学习目标**：认清注入并坚持参数化。\n\n**先修**：基础 DML。",
          "children": [
            {
              "id": "sql-injection",
              "title": "注入与参数化",
              "level": "???",
              "content": "### 是什么\n\n- **一句话定义**：把不可信字符串拼进 SQL，导致语义被篡改（删表、越权读）。\n- **正解**：参数化/预编译绑定，永不拼接用户输入。\n\n### 怎么写\n\n```sql\n-- 危险（示意，勿写）：\n-- \"SELECT * FROM users WHERE email = '\" + userInput + \"'\"\n\n-- MySQL 预编译思想：使用占位符由驱动绑定\n-- PREPARE stmt FROM 'SELECT * FROM users WHERE email = ?';\n-- SET @e = ?; EXECUTE stmt USING @e;\n\n-- 应用层（伪代码）：\n-- db.query('SELECT * FROM orders WHERE user_id = ?', [userId])\n```\n\n### 用在哪\n\n1. **登录/搜索框**。\n2. **动态排序字段**白名单校验。\n3. **管理后台**高危。\n\n### 注意啥\n\n- 即使用 ORM，原生 SQL 拼接同样危险。\n- 标识符（表名/列名）不能绑参，必须白名单。\n- 最小权限账号 + WAF 是纵深，不能替代参数化。",
              "children": []
            }
          ],
          "lessonParent": true
        }
      ]

    {
      "id": "sql-learning-path",
      "title": "学习路径",

      "content": "### 学习路径\n\n按初级→中级→高级推进，配合练习场与方言对照。",
      "children": [
        {
          "id": "sql-roadmap",
          "title": "路线图",
          "level": "??",
          "content": "### 路线图 · 章节导读\n\n**学习目标**：按清单顺序覆盖图谱叶节点。",
          "children": [
            {
              "id": "sql-path-junior",
              "title": "初级清单",
              "level": "?",
              "content": "### 是什么\n\n- **定位**：能独立完成单表查询、基础改写与简单聚合。\n- **建议顺序（对照本图谱叶标题）**：\n\n### 怎么写\n\n```text\n1. SELECT\n2. INSERT\n3. UPDATE/DELETE\n4. WHERE/ORDER\n5. GROUP BY\n6. HAVING\n7. NULL处理\n8. CASE WHEN\n9. 常用函数\n10. DISTINCT\n11. 分页LIMIT\n12. INNER\n13. LEFT\n14. CREATE TABLE\n15. 主键/外键/唯一\n```\n\n### 用在哪\n\n1. **入职首周**：跑通样例库。\n2. **数据分析新人**：取数自助。\n3. **后端新人**：CRUD 与安全更新。\n\n### 注意啥\n\n- 每课至少手敲一遍「怎么写」。\n- 先保证正确，再谈性能。\n- 同步建立 `orders`/`users` 练习库。",
              "children": []
            },
            {
              "id": "sql-path-mid",

          "content": "### 是什么\n- **一句话定义**：根据已有标签，把样本分到离散类别（如作弊/正常、流失/留存）。\n- **核心要素**：特征 \\(X\\)、类别标签 \\(y\\)、分类器 \\(f(X)\\to y\\)、评估指标（准确率/精确率/召回/F1/AUC）。\n\n### 概念要点\n- **二分类 vs 多分类**：两个类或多于两个类；多分类可用 OvR 或原生多类模型。\n- **概率输出**：`predict_proba` 可设业务阈值，不必死用 0.5。\n- **类别不平衡**：少数类更重要时看 PR-AUC、F1，并考虑 class_weight / 重采样。\n\n### 怎么用\n```python\nimport pandas as pd\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import classification_report, roc_auc_score\n\n# 示例：用消费与活跃预测「是否次月留存」\ndf = pd.DataFrame({\n    \"pay_30d\": [120, 0, 80, 200, 15, 0, 90, 40],\n    \"active_days\": [20, 2, 12, 25, 5, 1, 18, 7],\n    \"retained\": [1, 0, 1, 1, 0, 0, 1, 0],\n})\nX = df[[\"pay_30d\", \"active_days\"]]\ny = df[\"retained\"]\nXtr, Xte, ytr, yte = train_test_split(X, y, test_size=0.25, shuffle=False)\n\nclf = Pipeline([\n    (\"sc\", StandardScaler()),\n    (\"lr\", LogisticRegression(class_weight=\"balanced\", max_iter=1000)),\n])\nclf.fit(Xtr, ytr)\nproba = clf.predict_proba(Xte)[:, 1]\npred = (proba >= 0.5).astype(int)\nprint(classification_report(yte, pred))\nprint(\"AUC =\", roc_auc_score(yte, proba))\n```\n\n表格模型主力也可换：`HistGradientBoostingClassifier` / LightGBM / XGBoost。\n\n### 用在哪\n1. **风控审核**：交易是否欺诈 → 输出风险概率，驱动人工复核队列。\n2. **用户分层运营**：是否高意向转化 → 对高分人群发券。\n3. **内容审核**：文本/图像是否违规（常接深度学习分类器）。\n\n### 注意啥\n- **时间切分**：按时间划分训练/测试，禁止随机打乱造成穿越。\n- **阈值要贴业务**：召回优先还是精确率优先，决定阈值与成本。\n- **与聚类区别**：分类有标签；聚类无标签，只做分组。",

          "id": "ml-anomaly",
          "title": "异常检测",
          "level": "??",
          "content": "### 是什么\n- **一句话定义**：识别偏离正常模式的样本或时间点（欺诈、故障、刷量、指标突刺）。\n- **两种范式**：有少量标签的半监督/监督；无标签的无监督（孤立森林、统计阈值）。\n\n### 概念要点\n- **点异常 / 上下文异常 / 集体异常**：单点离谱、相对时段离谱、一群点共同离谱。\n- **阈值与告警**：检测要接到值班，控制误报率。\n- **解释**：业务要知道「为什么被打成异常」。\n\n### 怎么用\n```python\nimport numpy as np\nimport pandas as pd\nfrom sklearn.ensemble import IsolationForest\n\n# 示例：接口耗时异常点\nrng = np.random.default_rng(42)\nlatency = np.concatenate([rng.normal(120, 15, 80), [400, 520, 80, 600]])\nX = latency.reshape(-1, 1)\nclf = IsolationForest(contamination=0.05, random_state=42)\npred = clf.fit_predict(X)  # -1 异常，1 正常\nout = pd.DataFrame({\"latency_ms\": latency, \"is_outlier\": pred == -1})\nprint(out[out[\"is_outlier\"]].head(10))\nprint(\"异常占比\", out[\"is_outlier\"].mean())\n```\n\n指标类异常也可：同比/环比 + 3σ，或 Prophet 残差告警。\n\n### 用在哪\n1. **风控与反作弊**：异常登录、刷单。\n2. **数仓质量**：分区行数暴跌、空值率突增。\n3. **系统可观测**：延迟、错误率尖刺。\n\n### 注意啥\n- **污染率 contamination** 要按业务调，不是固定 5%。\n- **概念漂移**：大促期间「异常」可能是新常态，模型要重训或调阈值。\n- **与分类**：有可靠标签时，监督分类往往强于纯无监督。",

    let sqlKgState = { activeId: null, openIds: new Set(["sql-root", "sql-dml-query", "sql-window"]) };

    function sqlKgLevelClass(level) {
      if (level === "???") return "l3";
      if (level === "?") return "l1";
      return "";
    }

    function sqlKgLevelLabel(level) {
      if (level === "?") return "? 入门";
      if (level === "??") return "?? 进阶";
      if (level === "???") return "??? 高阶";
      return level || "";
    }

    function findSqlKgNode(id, node = SQL_KNOWLEDGE_TREE) {
      if (node.id === id) return node;
      for (const c of (node.children || [])) {
        const hit = findSqlKgNode(id, c);
        if (hit) return hit;
      }
      return null;
    }

    function sqlKgPathTitles(id) {
      const path = [];
      function dfs(node, trail) {
        const next = trail.concat(node.title);
        if (node.id === id) { path.push(...next); return true; }
        for (const c of (node.children || [])) {
          if (dfs(c, next)) return true;
        }
        return false;
      }
      dfs(SQL_KNOWLEDGE_TREE, []);
      return path;
    }

    function renderSqlKgTree(node) {
      const kids = node.children || [];
      const isLeaf = kids.length === 0;
      const opened = sqlKgState.openIds.has(node.id);
      const active = sqlKgState.activeId === node.id;
      const twist = isLeaf ? '<span class="sql-kg-twist empty">·</span>'
        : `<span class="sql-kg-twist">${opened ? "▼" : "▶"}</span>`;
      const level = node.level
        ? `<span class="sql-kg-level ${sqlKgLevelClass(node.level)}">${escapeHtml(sqlKgLevelLabel(node.level))}</span>`
        : "";
      let html = `<li class="sql-kg-node" data-id="${escapeHtml(node.id)}">
        <div class="sql-kg-row${isLeaf ? " leaf" : ""}${active ? " active" : ""}" data-act="node" data-id="${escapeHtml(node.id)}">

    function placeNodes() {
      const m = layoutMetrics();
      if (HOME_HERO_ONLY && !(kgDrill && kgDrill.active)) {
        const cx = (typeof width === "function" ? width() : m.w) / 2;
        const cy = (typeof height === "function" ? height() : m.h) / 2;
        const hubs = (typeof HOME_HERO_HUBS !== "undefined" && HOME_HERO_HUBS.length)
          ? HOME_HERO_HUBS : [HOME_HUB_ID];
        const R = Math.min(
          (typeof width === "function" ? width() : m.w),
          (typeof height === "function" ? height() : m.h)
        ) * 0.29;
        const hubSet = new Set(hubs);
        nodes.forEach(n => {
          const i = hubs.indexOf(n.id);
          if (i >= 0) {
            const ang = -Math.PI / 2 + (i * 2 * Math.PI / hubs.length);
            n.x = n.fx = cx + (hubs.length === 1 ? 0 : R * Math.cos(ang));
            n.y = n.fy = cy + (hubs.length === 1 ? 0 : R * Math.sin(ang));
          } else {
            n.x = n.fx = -4000;
            n.y = n.fy = -4000;
          }
        });
        return m;
      }
      nodes.forEach(n => {
        const L = LAYOUT[n.id] || { col: 0, row: 0 };
        const x = m.padX + (L.col + 0.5) * m.colW;
        let y;
        if (L.row >= 2) {
          y = m.padTop + m.mainH + m.govBand * 0.55;
        } else if (L.row === 0.5) {
          y = m.padTop + m.mainH * 0.48;
        } else {
          const t = Math.min(1.15, Math.max(0, L.row)) / 1.15;
          y = m.padTop + m.mainH * (0.22 + t * 0.56);
        }
        n.x = x; n.y = y; n.fx = x; n.fy = y;
      });
      return m;

    function drawHeroConnections() {
      if (!heroLinkG) return;
      heroLinkG.selectAll("*").remove();
      const hubs = (typeof HOME_HERO_HUBS !== "undefined" && HOME_HERO_HUBS.length) ? HOME_HERO_HUBS : [HOME_HUB_ID];
      const heroNodes = nodes.filter(n => hubs.indexOf(n.id) >= 0);
      if (heroNodes.length < 2) return;
      const m = layoutMetrics();
      const cx = m.w / 2, cy = m.h / 2;
      // 按角度排序
      heroNodes.sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
      // 相邻节点连线（实线）
      for (let i = 0; i < heroNodes.length; i++) {
        const a = heroNodes[i], b = heroNodes[(i + 1) % heroNodes.length];
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const nx = -dy / dist, ny = dx / dist;
        const bend = dist * 0.15;
        const cpx = mx + nx * bend, cpy = my + ny * bend;
        heroLinkG.append("path")
          .attr("d", `M${a.x},${a.y} Q${cpx},${cpy} ${b.x},${b.y}`)
          .attr("fill", "none")
          .attr("stroke", "rgba(148,163,184,0.25)")
          .attr("stroke-width", 1.5)
          .attr("class", "hero-link adjacent");
      }
      // 隔位节点连线（虚线）
      for (let i = 0; i < heroNodes.length; i++) {
        const a = heroNodes[i], b = heroNodes[(i + 2) % heroNodes.length];
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const nx = -dy / dist, ny = dx / dist;
        const bend = dist * 0.1;
        const cpx = mx + nx * bend, cpy = my + ny * bend;
        heroLinkG.append("path")
          .attr("d", `M${a.x},${a.y} Q${cpx},${cpy} ${b.x},${b.y}`)
          .attr("fill", "none")
          .attr("stroke", "rgba(167,139,250,0.1)")
          .attr("stroke-width", 0.8)
          .attr("stroke-dasharray", "4 6")
          .attr("class", "hero-link skip");
      }
      // 中心辐射线
      heroNodes.forEach(n => {
        heroLinkG.append("line")
          .attr("x1", cx).attr("y1", cy)
          .attr("x2", n.x).attr("y2", n.y)
          .attr("stroke", "rgba(34,211,238,0.06)")
          .attr("stroke-width", 0.6)
          .attr("class", "hero-link spoke");

        .attr("cx", cx).attr("cy", cy).attr("r", 80)
        .attr("fill", "rgba(148,163,184,0.06)")

        .attr("cx", cx).attr("cy", cy).attr("r", 45)
        .attr("fill", "rgba(148,163,184,0.08)")
        .attr("class", "hero-core-glow-inner");

        heroLinkG.append("circle")

          .attr("stroke", i === 0 ? "rgba(34,211,238,0.15)" : i === 1 ? "rgba(167,139,250,0.1)" : "rgba(96,165,250,0.08)")
          .attr("stroke-width", 1)
          .attr("class", "hero-core-ring")
          .style("animation", `corePulse 4s ease-in-out ${i * 1.3}s infinite`);
      }
      // 中心光点
      heroLinkG.append("circle")
        .attr("cx", cx).attr("cy", cy).attr("r", 4)
        .attr("fill", "#fff")
        .attr("filter", "drop-shadow(0 0 8px rgba(34,211,238,0.8))")
        .attr("class", "hero-core-dot");
    }

    function linkPath(d) {
      const sx = d.source.x, sy = d.source.y, tx = d.target.x, ty = d.target.y;
      const dx = tx - sx, dy = ty - sy;
      const dist = Math.hypot(dx, dy) || 1;
      const pad = 32;
      const x2 = tx - (dx / dist) * pad, y2 = ty - (dy / dist) * pad;
      const mx = (sx + x2) / 2, my = (sy + y2) / 2;
      const nx = -dy / dist, ny = dx / dist;
      const bend = Math.min(36, dist * 0.12) * (d.trunk ? 0.35 : 0.9);
      return `M${sx},${sy}Q${mx + nx * bend},${my + ny * bend} ${x2},${y2}`;
    }

    /* —— SQL/ML 画布焦点下钻（行业百科式扇形弧线 + 章节/讲义侧栏） —— */
    /* 三扇区（对齐行业百科：左上 / 右上 / 正下） */
    const KG_SECTORS = {
      foundation: { key: "foundation", label: "基础", color: "#f97316", glow: "rgba(249,115,22,0.55)", angDeg: 135 },
      advanced:   { key: "advanced",   label: "进阶", color: "#22c55e", glow: "rgba(34,197,94,0.5)",  angDeg: 45 },
      practice:   { key: "practice",   label: "实战", color: "#3b82f6", glow: "rgba(59,130,246,0.5)", angDeg: 270 }
    };
    const KG_SECTOR_ORDER = ["foundation", "advanced", "practice"];
    /** 已知领域显式扇区；其余按索引三等分或 level */
    const KG_SECTOR_BY_ID = {
      "sql-dml-query": "foundation", "sql-ddl": "foundation", "sql-join": "foundation",
      "sql-window": "advanced", "sql-cte": "advanced", "sql-index-plan": "advanced",
      "sql-tx-lock": "practice", "sql-txn": "practice", "sql-tune": "practice",
      "py-pandas": "foundation", "py-viz": "advanced",
      "etl-batch": "foundation", "etl-quality": "practice",
      "dwh-layer": "foundation", "dwh-model": "advanced",
      "bi-metric": "foundation", "bi-board": "advanced",
      "ml-tasks": "advanced", "ml-classify": "foundation", "ml-predict": "advanced",
      "ml-cluster": "advanced", "ml-recommend": "practice", "ml-anomaly": "practice"
    };
    let kgSettleTimer = null;
    let kgFocusHistory = [];

        function currentKgTree() {
          if (!kgDrill.hubId) return null;
          return KG_TREES[kgDrill.hubId] || null;
        }
    
        function findKgNode(id, node) {
          const root = node || currentKgTree();
          if (!root) return null;
          if (root.id === id) return root;
          for (const c of (root.children || [])) {
            const hit = findKgNode(id, c);
            if (hit) return hit;
          }
          return null;
        }
    
        function kgNodeKids(n) {
          return (n && n.children) ? n.children : [];
        }
    
        function isKgLeaf(n) {
          return !kgNodeKids(n).length;
        }
    
        /** 倒数第二层：有子节点且子节点全部为叶，或显式 lessonParent */
        function isLessonParent(n) {
          if (!n) return false;
          const kids = kgNodeKids(n);
          if (!kids.length) return false;
          if (n.lessonParent === true) return true;
          return kids.every(isKgLeaf);
        }
    
        function levelRank(level) {
          if (level === "?" || level === "1" || level === "junior") return 1;
          if (level === "???" || level === "3" || level === "senior") return 3;
          return 2; // ?? / mid / default
        }
    
        function depthAllows(level) {
          const need = levelRank(level);
          if (depthLevel === "junior") return need <= 1;
          if (depthLevel === "mid") return need <= 2;
          return true;
        }
    
        function filterKgChildren(kids) {
          return (kids || []).filter(c => depthAllows(c.level || "??"));
        }
    
        function kgPathTitles(id) {
          const root = currentKgTree();
          if (!root || !id) return [];
          const trail = [];
          function dfs(node) {
            trail.push(node.title);
            if (node.id === id) return true;
            for (const c of (node.children || [])) {
              if (dfs(c)) return true;
            }
            trail.pop();
            return false;
          }
          return dfs(root) ? trail.slice() : [];
        }
    
        function kgFocusPathTitles() {
          const parts = [];
          const root = currentKgTree();
          if (!root) return parts;
          parts.push(root.title);
          if (kgDrill.expandedL2) {
            const n = findKgNode(kgDrill.expandedL2);
            if (n) parts.push(n.title);
          }
          if (kgDrill.expandedL3) {
            const n = findKgNode(kgDrill.expandedL3);
            if (n) parts.push(n.title);
          }
          if (kgDrill.selectedLeafId) {
            const n = findKgNode(kgDrill.selectedLeafId);
            if (n && (!parts.length || parts[parts.length - 1] !== n.title)) parts.push(n.title);
          }
          return parts;
        }
    
        function snapshotKgFocus() {
          return {
            hubId: kgDrill.hubId,
            revealed: kgDrill.revealed,
            expandedL2: kgDrill.expandedL2,
            expandedL3: kgDrill.expandedL3,
            selectedLeafId: kgDrill.selectedLeafId,
            panelMode: kgDrill.panelMode
          };
        }

        function pushKgFocusHistory() {
          if (!kgDrill.active) return;
          const snap = snapshotKgFocus();
          const last = kgFocusHistory.length ? kgFocusHistory[kgFocusHistory.length - 1] : null;
          if (last &&
              last.expandedL2 === snap.expandedL2 &&
              last.expandedL3 === snap.expandedL3 &&
              last.selectedLeafId === snap.selectedLeafId &&
              last.panelMode === snap.panelMode) return;
          kgFocusHistory.push(snap);
          if (kgFocusHistory.length > 40) kgFocusHistory.shift();
        }

        function restoreKgFocusSnapshot(snap) {
          if (!snap || !kgDrill.active) return;
          kgDrill.revealed = snap.revealed !== false;
          kgDrill.expandedL2 = snap.expandedL2;
          kgDrill.expandedL3 = snap.expandedL3;
          kgDrill.selectedLeafId = snap.selectedLeafId;
          kgDrill.panelMode = snap.panelMode;
          redrawKgDrill();
          if (snap.selectedLeafId) {
            const n = findKgNode(snap.selectedLeafId);
            if (n) openKgSidePanel(n, snap.panelMode || (isLessonParent(n) ? "chapter" : "lesson"));
            else closePanelSoft();
          } else {
            closePanelSoft();
          }
          updateKgDrillHint();
        }

        function popKgFocusHistory() {
          if (!kgFocusHistory.length) {
            exitFocusToOverview();
            return;
          }
          const snap = kgFocusHistory.pop();
          restoreKgFocusSnapshot(snap);
        }

        function jumpKgPathDepth(depthIdx) {
          // depthIdx: 0 = hub only; 1 = L2; 2 = L3; 3 = leaf
          pushKgFocusHistory();
          if (depthIdx <= 0) {
            kgDrill.expandedL2 = null;
            kgDrill.expandedL3 = null;
            kgDrill.selectedLeafId = null;
            closePanelSoft();
            redrawKgDrill();
            updateKgDrillHint();
            return;
          }
          if (depthIdx === 1 && kgDrill.expandedL2) {
            kgDrill.expandedL3 = null;
            const n = findKgNode(kgDrill.expandedL2);
            kgDrill.selectedLeafId = isLessonParent(n) ? n.id : null;
            redrawKgDrill();
            if (n && isLessonParent(n)) openKgSidePanel(n, "chapter");
            else closePanelSoft();
            updateKgDrillHint();
            return;
          }
          if (depthIdx === 2 && kgDrill.expandedL3) {
            const n = findKgNode(kgDrill.expandedL3);
            kgDrill.selectedLeafId = n ? n.id : null;
            redrawKgDrill();
            if (n) openKgSidePanel(n, isLessonParent(n) ? "chapter" : "lesson");
            updateKgDrillHint();
          }
        }

          kgFocusHistory = [];

                  (last ? "" : " <span style=\"color:#64748b\">→</span> ");

              pathEl.querySelectorAll(".kg-crumb:not(.is-current)").forEach(el => {

          if (hintEl) {

            else if (kgDrill.selectedLeafId) hintEl.textContent = "右侧讲义 · 「返回」先回退历史，空则回总览";
            else hintEl.textContent = "一级领域 + 二级主题已展开 · 点二级学讲义 · 路径可回退";
          }
          if (legEl) {
            legEl.innerHTML = `<div class="kg-focus-legend-title">扇区图例</div>` + KG_SECTOR_ORDER.map(k => {
              const s = KG_SECTORS[k];
              return `<div class="kg-focus-leg-item"><span class="kg-focus-leg-dot" style="background:${s.color};color:${s.color}"></span>${escapeHtml(s.label)} · ${s.angDeg}°</div>`;
            }).join("") +
              `<div class="kg-focus-leg-item"><span class="kg-focus-leg-dot" style="background:#34d399;color:#34d399"></span>叶节点讲义</div>` +
              `<div class="kg-focus-leg-item"><span class="kg-focus-leg-dot" style="background:#f59e0b;color:#f59e0b"></span>已展开分支</div>`;
          }
          if (backBtn) {
            backBtn.textContent = kgFocusHistory.length ? "← 回退一步" : "← 返回总览";
            if (!backBtn._bound) {
              backBtn._bound = true;
              backBtn.addEventListener("click", (event) => {
                event.stopPropagation();

            }
          }
        }

        function updateKgDrillHint() {
          const el = document.getElementById("sqlDrillHint");
          updateKgFocusChrome();
          if (!el) return;
          if (!kgDrill.active) { el.hidden = true; return; }
          const hubName = (nodeById[kgDrill.hubId] && nodeById[kgDrill.hubId].name) || kgDrill.hubId;
          let msg;
          if (kgDrill.panelMode === "chapter") {

        }
    
        function stopKgPulse() {
          if (kgPulseTimer) {
            clearInterval(kgPulseTimer);
            kgPulseTimer = null;
          }
        }
    
        function startKgPulse() {
          stopKgPulse();
          if (!kgDrill.active || !kgDrill.hubId) return;
          let t = 0;
          kgPulseTimer = setInterval(() => {
            if (!kgDrill.active || typeof node === "undefined" || !node) return;
            t += 1;
            const r = 58 + Math.sin(t / 8) * 3.2;
            const blur = 22 + Math.sin(t / 8) * 8;
            node.filter(d => d.id === kgDrill.hubId).select("circle")
              .attr("r", r)
              .style("filter", `drop-shadow(0 0 ${blur}px rgba(168, 85, 247, 0.85))`);

        }
    
        function syncKgHubSize() {
          if (typeof node === "undefined" || !node) return;
          node.select("circle").attr("r", d => {
            if (kgDrill.active && d.id === kgDrill.hubId) return 62;
            if (HOME_HERO_ONLY && !kgDrill.active && d.id === HOME_HUB_ID) return 78;
            if (KG_TREES[d.id] || d.catalog) return 32;
            return 26;
          });
          node.classed("hub-expanded", d => (kgDrill.active && d.id === kgDrill.hubId) || d.id === expandedHubId);
          node.classed("kg-focus-hub", d => kgDrill.active && d.id === kgDrill.hubId);
          node.select(".sublabel").text(d => {

            }
            if (KG_TREES[d.id]) return "点击学教程";
            if (d.catalog) return "点击展开";
            return d.name.length > 5 ? d.name : "";
          });
          if (kgDrill.active) startKgPulse();
          else stopKgPulse();
        }
    
        function enterKgDrill(hubId) {
          const tree = KG_TREES[hubId];
          const hub = nodeById[hubId];
          if (!tree || !hub) return;
    
          if (kgDrill.active && kgDrill.hubId && kgDrill.hubId !== hubId && kgDrill.savedPos) {
            const prev = nodeById[kgDrill.hubId];
            if (prev) {
              prev.x = prev.fx = kgDrill.savedPos.x;
              prev.y = prev.fy = kgDrill.savedPos.y;
            }
          }
    
          kgDrill = {
            active: true,
            hubId,
            revealed: true,
            expandAllL2: true,
            expandedL2: null,
            expandedL3: null,
            selectedLeafId: null,
            panelMode: null,
            savedPos: { x: hub.x, y: hub.y }

          kgFocusHistory = [];
          document.body.classList.remove("home-hero");
    
          const cx = width() / 2;

          document.body.classList.add("kg-focus-on");
          expandedHubId = null;
          closePanelSoft();
          // flex 舞台改宽后重算画布，再画三扇区
          const finishEnter = () => {
            if (typeof relayout === "function") relayout();
            redrawKgDrill();
            updateKgDrillHint();
            syncKgHubSize();
            if (typeof tick === "function") tick();

            setTimeout(() => node.classed("kg-pop-in", false), 700);
          };
          if (typeof requestAnimationFrame === "function") {
            requestAnimationFrame(() => requestAnimationFrame(finishEnter));
          } else {

          }
        }
    
        function exitKgDrill() {
          stopKgPulse();
          if (typeof stopKgSettle === "function") stopKgSettle();
          kgFocusHistory = [];
          if (kgDrill.active && kgDrill.hubId && kgDrill.savedPos) {
            const hub = nodeById[kgDrill.hubId];
            if (hub) {
              hub.x = hub.fx = kgDrill.savedPos.x;
              hub.y = hub.fy = kgDrill.savedPos.y;
            }
          }
          kgDrill = {
            active: false,
            hubId: null,
            revealed: false,
            expandAllL2: false,
            expandedL2: null,
            expandedL3: null,
            selectedLeafId: null,
            panelMode: null,
            savedPos: null
          };
          document.body.classList.remove("kg-focus-on");
          if (HOME_HERO_ONLY) document.body.classList.add("home-hero");
          if (typeof node !== "undefined" && node) {
            node.classed("kg-focus-hub", false);
            node.select("circle").style("filter", null);
          }
          closePanelSoft();
          updateKgDrillHint();
          syncKgHubSize();
          if (typeof relayout === "function") relayout();
          else if (typeof tick === "function") tick();
        }
    
        function closePanelSoft() {

          panel.classList.remove("side-mode");

        }
    
        function renderMdBlock(md) {

        function openKgSidePanel(kgNode, mode) {

          if (resolved === "chapter") {

            bodyHtml += `<div class="chapter-lessons">

                /* keep */

          selectedId = kgDrill.hubId;

        }
    
        /** 百科同款极角：y 轴向下时用 -sin，使 135°=左上、45°=右上、270°=正下 */
        function polarOffset(ang, r) {
          return { dx: Math.cos(ang) * r, dy: -Math.sin(ang) * r };
        }

        function sectorAngleRad(key) {
          const s = KG_SECTORS[key] || KG_SECTORS.advanced;
          return (s.angDeg * Math.PI) / 180;
        }

        function assignSectorKey(node, index, total) {
          if (node && node.sector && KG_SECTORS[node.sector]) return node.sector;
          if (node && KG_SECTOR_BY_ID[node.id]) return KG_SECTOR_BY_ID[node.id];
          const rank = levelRank(node && node.level);
          const levels = []; // filled by caller when mixed — fallback thirds
          if (total <= 1) return "advanced";
          // 若调用方传入了多样性，优先用 level；此处默认三等分以形成辐射剪影
          const third = Math.ceil(total / 3) || 1;
          if (index < third) return "foundation";
          if (index < third * 2) return "advanced";
          return "practice";
        }

        function assignSectorKeySmart(nodes) {
          const ranks = nodes.map(n => levelRank(n.level || "??"));
          const uniq = new Set(ranks);
          return nodes.map((n, i) => {
            if (n.sector && KG_SECTORS[n.sector]) return n.sector;
            if (KG_SECTOR_BY_ID[n.id]) return KG_SECTOR_BY_ID[n.id];
            if (uniq.size >= 2) {
              const r = levelRank(n.level || "??");
              if (r <= 1) return "foundation";
              if (r >= 3) return "practice";
              return "advanced";
            }
            return assignSectorKey(n, i, nodes.length);
          });
        }

        /** 二次贝塞尔弧线（顺时针弯，模拟百科 curvedCW） */
        function satArcPath(px, py, x, y, layer, siblingIndex, siblingTotal) {
          const dx = x - px, dy = y - py;
          const dist = Math.hypot(dx, dy) || 1;
          const pad = layer >= 4 ? 16 : layer === 3 ? 18 : 22;
          const tx = x - (dx / dist) * pad;
          const ty = y - (dy / dist) * pad;
          const mx = (px + tx) / 2;
          const my = (py + ty) / 2;
          const nx = -dy / dist, ny = dx / dist;
          const roundness = layer <= 2 ? 0.28 : 0.35;
          const bend = Math.min(48, dist * roundness) * (siblingTotal > 1 ? 1 : 0.7);
          const sign = 1;
          return `M${px},${py}Q${mx + nx * bend * sign},${my + ny * bend * sign} ${tx},${ty}`;
        }

        function stopKgSettle() {
          if (kgSettleTimer) {
            clearTimeout(kgSettleTimer);
            kgSettleTimer = null;
          }
        }

        /** 短时 forceCollide，保留扇区目标位（百科 BarnesHut settle 的轻量版） */
        function settleSatPositions(items, hub) {
          if (!items.length || typeof d3 === "undefined" || !d3.forceSimulation) return items;
          const nodes = items.map((d, i) => ({
            index: i,
            x: d.x,
            y: d.y,
            tx: d.x,
            ty: d.y,
            r: d.isLeaf ? 18 : (d.isBranch ? 30 : (d.layer === 2 ? 28 : 22))
          }));
          const sim = d3.forceSimulation(nodes)
            .force("collide", d3.forceCollide().radius(d => d.r + 4).strength(0.85).iterations(2))
            .force("x", d3.forceX(d => d.tx).strength(0.18))
            .force("y", d3.forceY(d => d.ty).strength(0.18))
            .stop();
          for (let i = 0; i < 32; i++) sim.tick();
          const minDist = 78;
          nodes.forEach((n, i) => {
            const dx = n.x - hub.x, dy = n.y - hub.y;
            const dist = Math.hypot(dx, dy) || 1;
            if (dist < minDist) {
              n.x = hub.x + (dx / dist) * minDist;
              n.y = hub.y + (dy / dist) * minDist;
            }
            items[i].x = n.x;
            items[i].y = n.y;
          });
          return items;
        }

        function paintSatLayer(items) {
          satData = items;
          satLinkSel = satLinkG.selectAll("path").data(satData, d => d.learnId)
            .join("path")
            .attr("class", d => `sat-link layer-${d.layer}${d.layer >= 3 ? " dashed" : ""}`)
            .attr("stroke", d => d.color)
            .attr("d", d => satArcPath(d.parentX, d.parentY, d.x, d.y, d.layer, d.sibIdx, d.sibTotal));

          satNodeSel = satNodeG.selectAll("g").data(satData, d => d.learnId)
            .join(enter => {
              const g = enter.append("g").attr("class", "sat-node");
              g.append("circle");
              g.append("text").attr("class", "sat-label");
              g.append("text").attr("class", "sat-sub").attr("dy", 20);
              return g;
            })
            .attr("transform", d => `translate(${d.x},${d.y})`)
            .attr("class", d => {
              let cls = `sat-node layer-${d.layer}`;
              if (d.isLeaf) cls += " is-leaf";
              if (d.isChapter) cls += " is-chapter";
              if (d.isBranch) cls += " is-branch";
              return cls;
            })
            .classed("selected", d => d.kgId === kgDrill.selectedLeafId)
            .classed("learned", d => isLearned(d.learnId));

          satNodeSel.select("circle")
            .attr("r", d => {
              if (d.isLeaf) return 17;
              if (d.isBranch) return 28;
              if (d.isChapter) return 24;
              if (d.layer === 2) return 26;
              return 20;
            })
            .attr("fill", d => d.color)
            .style("filter", d => d.sectorGlow
              ? `drop-shadow(0 0 12px ${d.sectorGlow})`
              : null);
          satNodeSel.select("text.sat-label")
            .text(d => d.name.length > 7 ? d.name.slice(0, 6) + "…" : d.name);
          satNodeSel.select("text.sat-sub")
            .text(d => {
              if (d.isLeaf) return "讲义";
              if (d.isChapter && d.isBranch) return "导读";
              if (d.isChapter) return "章节";
              if (d.isBranch) return "已展开";
              return "展开";
            });

          satNodeSel.on("click", (event, d) => {
            event.stopPropagation();
            onKgDrillClick(d);
          });
        }

        function redrawKgDrill() {
          if (!kgDrill.active) return;
          const tree = currentKgTree();
          const hub = nodeById[kgDrill.hubId];
          if (!hub || !tree) return;
          const items = [];

          function pushFan(c, px, py, layer, baseR, idx, total, parentAng, color, sectorKey, sectorGlow) {
            let ang;
            if (total <= 1) {
              ang = (parentAng != null) ? parentAng : sectorAngleRad(sectorKey || "advanced");
            } else if (parentAng != null && layer > 2) {
              const fan = Math.min(1.15, 0.22 * Math.max(total, 1));
              ang = parentAng - fan / 2 + (fan * idx) / Math.max(total - 1, 1);
            } else if (parentAng != null) {
              const spread = Math.min(0.9, 0.18 * Math.max(total, 1));
              ang = total === 1 ? parentAng : parentAng - spread / 2 + (spread * idx) / Math.max(total - 1, 1);
            } else {
              ang = -Math.PI / 2;
            }
            const jitter = (idx % 3) * (layer === 2 ? 22 : 14);
            const r = baseR + jitter;
            const off = polarOffset(ang, r);
            const x = px + off.dx;
            const y = py + off.dy;
            const rawKids = kgNodeKids(c);
            const canExpand = filterKgChildren(rawKids).length > 0;
            const isL2Exp = layer === 2 && kgDrill.expandedL2 === c.id;
            const isL3Exp = layer === 3 && kgDrill.expandedL3 === c.id;
            const expanded = isL2Exp || isL3Exp;
            const leaf = !rawKids.length;
            const chapter = isLessonParent(c);
            const sec = KG_SECTORS[sectorKey] || null;
            const fill = leaf
              ? "#34d399"
              : (expanded ? "#f59e0b" : (color || (sec ? sec.color : "#38bdf8")));
            items.push({
              learnId: "kg:" + kgDrill.hubId + ":" + c.id,
              kgId: c.id,
              name: c.title,
              x, y,
              parentX: px,
              parentY: py,
              layer,
              ang,
              r,
              sibIdx: idx,
              sibTotal: total,
              isLeaf: leaf,
              isChapter: chapter && !leaf,
              isBranch: canExpand && expanded,
              color: fill,
              sectorKey: sectorKey || null,
              sectorGlow: sectorGlow || (sec ? sec.glow : null)
            });
            return { x, y, ang, r, hasKids: canExpand, expanded, leaf, chapter };
          }

          if (kgDrill.revealed) {
            const l2s = filterKgChildren(tree.children || []);
            const sectorKeys = assignSectorKeySmart(l2s);
            const groups = { foundation: [], advanced: [], practice: [] };
            l2s.forEach((c, i) => {
              const key = sectorKeys[i] || "advanced";
              groups[key] = groups[key] || [];
              groups[key].push({ node: c, sectorKey: key });
            });
            KG_SECTOR_ORDER.forEach((key) => {
              const list = groups[key] || [];
              if (!list.length) return;
              const sec = KG_SECTORS[key];
              const base = sectorAngleRad(key);
              const n = list.length;
              const spread = Math.min(0.9, 0.18 * Math.max(n, 1));
              list.forEach((entry, i) => {
                const c = entry.node;
                const ang = n === 1 ? base : base - spread / 2 + (spread * i) / Math.max(n - 1, 1);
                const baseR = 200 + (i % 3) * 24;
                const off = polarOffset(ang, baseR);
                const placed = {
                  x: hub.x + off.dx,
                  y: hub.y + off.dy,
                  ang,
                  r: baseR
                };
                // push via shared item builder (manual parent = hub)
                const rawKids = kgNodeKids(c);
                const canExpand = filterKgChildren(rawKids).length > 0;
                const expanded = kgDrill.expandAllL2 || kgDrill.expandedL2 === c.id;
                const leaf = !rawKids.length;
                const chapter = isLessonParent(c);
                items.push({
                  learnId: "kg:" + kgDrill.hubId + ":" + c.id,
                  kgId: c.id,
                  name: c.title,
                  x: placed.x,
                  y: placed.y,
                  parentX: hub.x,
                  parentY: hub.y,
                  layer: 2,
                  ang: placed.ang,
                  r: placed.r,
                  sibIdx: i,
                  sibTotal: n,
                  isLeaf: leaf,
                  isChapter: chapter && !leaf,
                  isBranch: canExpand && expanded,
                  color: leaf ? "#34d399" : (expanded ? "#f59e0b" : sec.color),
                  sectorKey: key,
                  sectorGlow: sec.glow
                });
                // 一级领域展开后立刻带出二级主题（expandAllL2 或单选 expandedL2）
                if (expanded && canExpand) {
                  const l3s = filterKgChildren(c.children || []);
                  l3s.forEach((c3, j) => {
                    const p3 = pushFan(c3, placed.x, placed.y, 3, 108, j, l3s.length, placed.ang, sec.color, key, sec.glow);
                    if (kgDrill.expandedL3 === c3.id && p3.hasKids) {
                      const l4s = filterKgChildren(c3.children || []);
                      l4s.forEach((c4, k) => {
                        pushFan(c4, p3.x, p3.y, 4, 82, k, l4s.length, p3.ang, sec.color, key, sec.glow);
                      });
                    }
                  });
                }
              });
            });
          }

          settleSatPositions(items, hub);
          paintSatLayer(items);
          syncKgHubSize();
          updateKgDrillHint();
          updateKgFocusChrome();
        }

        function onKgDrillClick(sat) {
          const kg = findKgNode(sat.kgId);
          if (!kg) return;
          const kids = filterKgChildren(kgNodeKids(kg));
          const rawKids = kgNodeKids(kg);
          pushKgFocusHistory();

          // 叶节点 → 讲义
          if (!rawKids.length) {
            kgDrill.selectedLeafId = kg.id;
            redrawKgDrill();
            openKgSidePanel(kg, "lesson");
            return;
          }
    
          if (sat.layer === 2) {
            // 一级领域：保持全部二级可见；点领域可打开章节导读或聚焦该支
            kgDrill.expandedL2 = kg.id;
            kgDrill.expandedL3 = null;
            if (isLessonParent(kg)) {
              kgDrill.selectedLeafId = kg.id;
              redrawKgDrill();
              openKgSidePanel(kg, "chapter");
            } else {
              // 非章节父：仅聚焦，二级主题已由 expandAllL2 展示
              kgDrill.selectedLeafId = null;
              closePanelSoft();
              redrawKgDrill();
            }
            return;
          }
    
          if (sat.layer === 3) {
            if (!kids.length && rawKids.length) {
              // 深度过滤后无可见子节点：当作章节导读
              kgDrill.expandedL3 = kg.id;
              kgDrill.selectedLeafId = kg.id;
              redrawKgDrill();
              openKgSidePanel(kg, "chapter");
              return;
            }
            if (isLessonParent(kg)) {
              if (kgDrill.expandedL3 !== kg.id) kgDrill.expandedL3 = kg.id;
              kgDrill.selectedLeafId = kg.id;
              redrawKgDrill();
              openKgSidePanel(kg, "chapter");
              return;
            }
            if (kgDrill.expandedL3 === kg.id) {
              kgDrill.expandedL3 = null;
              kgDrill.selectedLeafId = null;
              closePanelSoft();
            } else {
              kgDrill.expandedL3 = kg.id;
              kgDrill.selectedLeafId = null;
              closePanelSoft();
            }
            redrawKgDrill();
            return;
          }
    
          // L4+
          kgDrill.selectedLeafId = kg.id;
          redrawKgDrill();
          openKgSidePanel(kg, isLessonParent(kg) ? "chapter" : "lesson");
        }

        function clearSatellites() {
      expandedHubId = null;
      if (typeof stopKgPulse === "function") stopKgPulse();
      if (typeof stopKgSettle === "function") stopKgSettle();
      if (kgDrill && kgDrill.active) exitKgDrill();
      satData = [];
      satLinkG.selectAll("*").remove();
      satNodeG.selectAll("*").remove();
      satNodeSel = null;
      satLinkSel = null;
      node.classed("hub-expanded", false);
      syncKgHubSize();
    }

    function redrawSatellites() {
      if (kgDrill && kgDrill.active) {
        redrawKgDrill();
        return;
      }
      if (!expandedHubId) return;
      const hub = nodeById[expandedHubId];
      if (!hub || !hub.engines) { clearSatellites(); return; }
      const nEng = hub.engines.length;
      const R = Math.min(155, 72 + nEng * 8);
      satData = hub.engines.map((e, i) => {
        const ang = -Math.PI / 2 + (i / nEng) * Math.PI * 2;
        return {
          learnId: hub.id + ":" + e.id,
          engineId: e.id,
          hubId: hub.id,
          name: e.name,
          x: hub.x + Math.cos(ang) * R,
          y: hub.y + Math.sin(ang) * R,
          color: CATEGORIES[hub.category].color
        };
      });
      satLinkSel = satLinkG.selectAll("path").data(satData, d => d.learnId)
        .join("path")
        .attr("class", "sat-link")
        .attr("stroke", d => d.color)
        .attr("d", d => satArcPath(hub.x, hub.y, d.x, d.y, 2, 0, nEng));
      satNodeSel = satNodeG.selectAll("g").data(satData, d => d.learnId)
        .join(enter => {
          const g = enter.append("g").attr("class", "sat-node");
          g.append("circle").attr("r", 20);
          g.append("text").attr("class", "sat-label");
          return g;
        })
        .attr("transform", d => `translate(${d.x},${d.y})`)
        .classed("learned", d => isLearned(d.learnId))
        .classed("selected", d => panelState.engineId === d.engineId);
      satNodeSel.select("circle").attr("fill", d => d.color);
      satNodeSel.select("text").text(d => d.name.length > 6 ? d.name.slice(0, 5) + "…" : d.name);
      satNodeSel.on("click", (event, d) => {
        event.stopPropagation();
        openSatellite(d);
      });
      node.classed("hub-expanded", n => n.id === expandedHubId);
    }

    function expandCatalog(hub) {
      if (!hub.catalog || !hub.engines || !hub.engines.length) {
        clearSatellites();
        return;
      }
      expandedHubId = hub.id;
      redrawSatellites();
    }

    function openSatellite(sat) {
      const hub = nodeById[sat.hubId];
      if (!hub) return;
      selectedId = hub.id;
      panelState = { mode: "engine", engineId: sat.engineId, compareOn: false, compareIds: [] };
      const related = neighbors[hub.id] || new Set();
      node.classed("selected", n => n.id === hub.id)
        .classed("related", n => related.has(n.id))
        .classed("dimmed", n => n.id !== hub.id && !related.has(n.id));
      link.classed("active", l => l.source.id === hub.id || l.target.id === hub.id)
        .classed("dimmed", l => l.source.id !== hub.id && l.target.id !== hub.id)
        .attr("marker-end", l =>
          (l.source.id === hub.id || l.target.id === hub.id) ? "url(#arrow-active)" : "url(#arrow)");
      renderPanel(hub);
      redrawSatellites();
    }

    node.on("click", (event, d) => {
      event.stopPropagation();
      panelState = { mode: d.catalog ? "list" : "overview", engineId: null, compareOn: false, compareIds: [] };
      if (KG_TREES[d.id]) {
        // 行业百科式：进入焦点即展开三扇区
        selectedId = d.id;
        const related = neighbors[d.id] || new Set();
        node.classed("selected", n => n.id === d.id)
          .classed("related", n => related.has(n.id))
          .classed("dimmed", n => n.id !== d.id && !related.has(n.id));
        link.classed("active", l => l.source.id === d.id || l.target.id === d.id)
          .classed("dimmed", l => l.source.id !== d.id && l.target.id !== d.id)
          .attr("marker-end", l =>
            (l.source.id === d.id || l.target.id === d.id) ? "url(#arrow-active)" : "url(#arrow)");
        if (kgDrill.active && kgDrill.hubId === d.id) {
          if (!kgDrill.revealed) {
            kgDrill.revealed = true;
            redrawKgDrill();
          }
          updateKgDrillHint();
          syncKgHubSize();
        } else {
          enterKgDrill(d.id);
        }
        syncLearnedUI();
        return;
      }
      if (kgDrill && kgDrill.active) exitKgDrill();
      selectNode(d);
      if (d.catalog) expandCatalog(d);
      else clearSatellites();
    });
    svg.on("click", () => { clearSatellites(); closePanel(); });

    function tick() {
      link.attr("d", linkPath);
      node.attr("transform", d => `translate(${d.x},${d.y})`);
      if ((kgDrill && kgDrill.active) || expandedHubId) redrawSatellites();
    }

    function applyLinkVisibility() {
      link.classed("hidden", false)
        .attr("marker-end", d => "url(#arrow)");
      if (!selectedId) {
        link.classed("active", false).classed("dimmed", false);
      }
    }

    function selectNode(d) {
      selectedId = d.id;
      const related = neighbors[d.id] || new Set();
      node.classed("selected", n => n.id === d.id)
        .classed("related", n => related.has(n.id))
        .classed("dimmed", n => n.id !== d.id && !related.has(n.id));
      link.classed("hidden", false)
        .classed("active", l => l.source.id === d.id || l.target.id === d.id)
        .classed("dimmed", l => l.source.id !== d.id && l.target.id !== d.id)
        .attr("marker-end", l =>
          (l.source.id === d.id || l.target.id === d.id) ? "url(#arrow-active)" : "url(#arrow)");
      renderPanel(d);
    }

    function resetHighlight() {
      selectedId = null;
      node.classed("selected", false).classed("related", false).classed("dimmed", false).classed("hub-expanded", false);
      applyLinkVisibility();
      syncLearnedUI();
      tick();
    }

    function setDepth(level) {
      depthLevel = level;
      document.getElementById("btnDepthJunior").classList.toggle("active", level === "junior");
      document.getElementById("btnDepthMid").classList.toggle("active", level === "mid");
      document.getElementById("btnDepthSenior").classList.toggle("active", level === "senior");
      if (kgDrill && kgDrill.active) {
        // 深度过滤知识树可见节点；已展开但被滤掉的分支自动收起
        redrawKgDrill();
        if (kgDrill.selectedLeafId) {
          const cur = findKgNode(kgDrill.selectedLeafId);
          if (cur) openKgSidePanel(cur, kgDrill.panelMode || (isLessonParent(cur) ? "chapter" : "lesson"));
        }
        return;
      }
      if (selectedId) {
        const n = nodes.find(x => x.id === selectedId);
        if (n) renderPanel(n);
      }
    }
    document.getElementById("btnDepthJunior").addEventListener("click", () => setDepth("junior"));
    document.getElementById("btnDepthMid").addEventListener("click", () => setDepth("mid"));
    document.getElementById("btnDepthSenior").addEventListener("click", () => setDepth("senior"));

    function relayout() {
      const m = placeNodes();
      drawStages(m);
      tick();
      const scale = Math.min(1, width() / m.w, height() / m.h);
      const tx = (width() - m.w * scale) / 2;
      const ty = (height() - m.h * scale) / 2;
      svg.call(zoom.transform, d3.zoomIdentity.translate(Math.max(0, tx), Math.max(0, ty)).scale(scale < 1 ? scale : 1));
    }

    window.addEventListener("resize", () => relayout());
    applyLinkVisibility();
    syncLearnedUI();
    tick();
    relayout();

  </script>
</body>
</html>
