    const KG_TREE_LOADING = {};
    function hasKgCurriculum(hubId) {
      return !!(hubId && (KG_TREES[hubId] || KG_TREE_FILES[hubId]));
    }
    async function ensureKgTree(hubId) {
      if (!hubId) return null;
      if (KG_TREES[hubId]) return KG_TREES[hubId];
      if (KG_TREE_LOADING[hubId]) return KG_TREE_LOADING[hubId];

      const fromEmbed = () => {
        try {
          if (window.__KG_EMBEDDED && window.__KG_EMBEDDED[hubId]) {
            return window.__KG_EMBEDDED[hubId];
          }
          const el = document.getElementById("kg-embed-" + hubId);
          if (el && el.textContent) return JSON.parse(el.textContent);
        } catch (e) { console.warn("kg embed parse", hubId, e); }
        return null;
      };

      const embedded = fromEmbed();
      if (embedded) {
        KG_TREES[hubId] = embedded;
        return embedded;
      }

      const rel = KG_TREE_FILES[hubId];
      if (!rel) return null;
      const url = new URL(rel, window.location.href).toString();
      const legacy = new URL("kg-data/" + hubId + ".json?v=" + (typeof KG_DATA_VER !== "undefined" ? KG_DATA_VER : "1"), window.location.href).toString();

      KG_TREE_LOADING[hubId] = (async () => {
        const tryFetch = async (u) => {
          let res = await fetch(u);
          if (!res.ok) res = await fetch(u, { cache: "reload" });
          if (!res.ok) throw new Error("HTTP " + res.status + " " + u);
          const tree = await res.json();
          if (!tree || typeof tree !== "object") throw new Error("invalid kg tree " + hubId);
          return tree;
        };
        let tree = null;
        let lastErr = null;
        for (const u of [url, legacy]) {
          try { tree = await tryFetch(u); break; }
          catch (e) { lastErr = e; }
        }
        if (!tree) throw (lastErr || new Error("kg load failed " + hubId));
        KG_TREES[hubId] = tree;
        delete KG_TREE_LOADING[hubId];
        return tree;
      })();
      try {
        return await KG_TREE_LOADING[hubId];
      } catch (err) {
        delete KG_TREE_LOADING[hubId];
        throw err;
      }
    }
    function prefetchKgTreesIdle() {
      const ids = Object.keys(KG_TREE_FILES);
      let i = 0;
      const schedule = () => {
        if (i >= ids.length) return;
        const go = () => {
          if (typeof kgDrill !== "undefined" && kgDrill && kgDrill.active) {
            setTimeout(schedule, 1200);
            return;
          }
          const hubId = ids[i++];
          ensureKgTree(hubId).catch(() => {}).then(() => schedule());
        };
        if (typeof requestIdleCallback === "function") requestIdleCallback(go, { timeout: 1800 });
        else setTimeout(go, 700);
      };
      setTimeout(schedule, 900);
    }




    let sqlKgState = { activeId: null, openIds: new Set(["sql-root", "sql-L0", "sql-L1"]) };

    function sqlKgLevelClass(level) {
      const s = String(level || "");
      if (s === "?" || s === "Low" || /^L[01]$/i.test(s)) return "l1";
      if (s === "???" || s === "High" || /^L[56]$/i.test(s)) return "l3";
      return "";
    }

    function sqlKgLevelLabel(level) {
      if (!level) return "";
      const s = String(level);
      if (s === "?") return "? 入门";
      if (s === "??") return "?? 进阶";
      if (s === "???") return "??? 高阶";
      if (/^L0$/i.test(s) || /^L1$/i.test(s)) return s + " 入门";
      if (/^L[2-4]$/i.test(s)) return s + " 进阶";
      if (/^L[5-6]$/i.test(s)) return s + " 高阶";
      if (s === "Low") return "Low 初级";
      if (s === "Mid") return "Mid 中级";
      if (s === "High") return "High 高级";
      return s;
    }

    function findSqlKgNode(id, node) {
      if (!node) node = (KG_TREES && KG_TREES.sql) || { id: "sql-root", title: "SQL", children: [] };
      if (node.id === id) return node;
      for (const c of (node.children || [])) {
        const hit = findSqlKgNode(id, c);
        if (hit) return hit;
      }
      return null;
    }

    function sqlKgPathTitles(id) {
      const path = [];
      function dfs(node, trail) {
        const next = trail.concat(node.title);
        if (node.id === id) { path.push(...next); return true; }
        for (const c of (node.children || [])) {
          if (dfs(c, next)) return true;
        }
        return false;
      }
      dfs((KG_TREES && KG_TREES.sql) || { id: "sql-root", title: "SQL", children: [] }, []);
      return path;
    }

    function renderSqlKgTree(node) {
      const kids = node.children || [];
      const isLeaf = kids.length === 0;
      const opened = sqlKgState.openIds.has(node.id);
      const active = sqlKgState.activeId === node.id;
      const twist = isLeaf ? '<span class="sql-kg-twist empty">·</span>'
        : `<span class="sql-kg-twist">${opened ? "▼" : "▶"}</span>`;
      const level = node.level
        ? `<span class="sql-kg-level ${sqlKgLevelClass(node.level)}">${escapeHtml(sqlKgLevelLabel(node.level))}</span>`
        : "";
      let html = `<li class="sql-kg-node" data-id="${escapeHtml(node.id)}">
        <div class="sql-kg-row${isLeaf ? " leaf" : ""}${active ? " active" : ""}" data-act="node" data-id="${escapeHtml(node.id)}">
          ${twist}<span class="sql-kg-title">${escapeHtml(node.title)}</span>${level}
        </div>`;
      if (!isLeaf && opened) {
        html += `<ul>${kids.map(renderSqlKgTree).join("")}</ul>`;
      }
      html += "</li>";
      return html;
    }

    function openSqlKgDrawer(node) {

    function bindSqlKgEvents() {
      const tree = panelBody.querySelector("#sqlKgTree");
      if (!tree) return;
      tree.querySelectorAll('[data-act="node"]').forEach((el) => {
        el.addEventListener("click", (ev) => {
          ev.stopPropagation();
          const id = el.getAttribute("data-id");
          const node = findSqlKgNode(id);
          if (!node) return;
          const kids = node.children || [];
          if (kids.length) {
            if (sqlKgState.openIds.has(id)) sqlKgState.openIds.delete(id);
            else sqlKgState.openIds.add(id);
            sqlKgState.activeId = id;
            paintSqlKg();
            // 非叶子：若有 content，也可在抽屉预览导读
            if (node.content) openSqlKgDrawer(node);
            else closeSqlKgDrawer();
          } else {
            sqlKgState.activeId = id;
            sqlKgState.openIds.add(id);
            paintSqlKg();
            openSqlKgDrawer(node);
          }
        });
      });

    /* 右侧讲义面板：左缘拖拽加宽 */
    (function wirePanelResize() {
      const handle = document.getElementById("panelResize");
      if (!handle || !panel) return;
      const MIN_W = 320;
      const MAX_W = () => Math.min(Math.floor(window.innerWidth * 0.75), 960);
      const root = document.documentElement;
      const isKg = () => document.body.classList.contains("kg-focus-on");
      const applyWidth = (n) => {
        const w = Math.max(MIN_W, Math.min(MAX_W(), Math.round(n)));
        const px = w + "px";
        if (isKg()) {
          root.style.setProperty("--kg-panel-w", px);
          panel.style.flexBasis = px;
          panel.style.width = px;
        } else {
          root.style.setProperty("--panel-side-w", px);
        }
        return w;
      };
      try {
        const savedKg = Number(localStorage.getItem("kgPanelW") || 0);
        const savedSide = Number(localStorage.getItem("panelSideW") || 0);
        if (savedKg >= MIN_W) root.style.setProperty("--kg-panel-w", savedKg + "px");
        if (savedSide >= MIN_W) root.style.setProperty("--panel-side-w", savedSide + "px");
      } catch (_) {}

      let dragging = false;
      let moved = false;
      let startX = 0;
      let lastW = 0;
      let suppressTimer = 0;
      const blockTrailingClick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      };
      const armClickSuppress = () => {
        panelResizeSuppressClick = true;
        document.addEventListener("click", blockTrailingClick, true);
        if (suppressTimer) clearTimeout(suppressTimer);
        suppressTimer = setTimeout(() => {
          document.removeEventListener("click", blockTrailingClick, true);
          panelResizeSuppressClick = false;
          suppressTimer = 0;
        }, 160);
      };
      const onMove = (ev) => {
        if (!dragging) return;
        const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
        if (Math.abs(clientX - startX) > 2) moved = true;
        lastW = applyWidth(window.innerWidth - clientX);
        if (ev.cancelable) ev.preventDefault();
      };
      const onUp = (ev) => {
        if (!dragging) return;
        const didDrag = moved;
        dragging = false;
        moved = false;
        panel.classList.remove("is-resizing");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("touchmove", onMove);
        window.removeEventListener("touchend", onUp);
        /* 先挡住松手后落在画布/「总览」上的合成 click，再释放 capture */
        if (didDrag) armClickSuppress();
        if (ev) {
          if (ev.cancelable) ev.preventDefault();
          ev.stopPropagation();
        }
        try { if (handle.releasePointerCapture && ev && ev.pointerId != null) handle.releasePointerCapture(ev.pointerId); } catch (_) {}
        try {
          if (lastW) localStorage.setItem(isKg() ? "kgPanelW" : "panelSideW", String(lastW));
        } catch (_) {}
        if (typeof relayout === "function") {
          try { relayout(); } catch (_) {}
        }
      };
      const onDown = (ev) => {
        if (!panel.classList.contains("open") || !panel.classList.contains("side-mode")) return;
        dragging = true;
        moved = false;
        startX = ev.touches ? ev.touches[0].clientX : ev.clientX;
        panel.classList.add("is-resizing");
        document.body.style.cursor = "col-resize";
        document.body.style.userSelect = "none";
        try { if (handle.setPointerCapture && ev.pointerId != null) handle.setPointerCapture(ev.pointerId); } catch (_) {}
        window.addEventListener("pointermove", onMove, { passive: false });
        window.addEventListener("pointerup", onUp);
        window.addEventListener("touchmove", onMove, { passive: false });
        window.addEventListener("touchend", onUp);
        ev.preventDefault();
        ev.stopPropagation();
      };
      handle.addEventListener("pointerdown", onDown);
      handle.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
      handle.addEventListener("dblclick", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const def = isKg() ? 520 : 480;
        lastW = applyWidth(def);
        try { localStorage.setItem(isKg() ? "kgPanelW" : "panelSideW", String(def)); } catch (_) {}
        if (typeof relayout === "function") {
          try { relayout(); } catch (_) {}
        }
      });
    })();

    (function wireSatLinkToggle() {

      let on = true;
      try {
        const v = localStorage.getItem(KEY);
        if (v === "0") on = false;
        else if (v === "1") on = true;

      apply(on, false);

          const root = node || currentKgTree();
          if (!root) return null;
          if (root.id === id) return root;

            const hit = findKgNode(id, c);
            if (hit) return hit;
          }
          return null;

        /** 倒数第二层：有子节点且子节点全部为叶，或显式 lessonParent */
        function isLessonParent(n) {
          if (!n) return false;

          if (!kids.length) return false;
          if (n.lessonParent === true) return true;
          return kids.every(isKgLeaf);
        }
    
        function levelRank(level) {
          if (level == null || level === "") return 2;
          const s = String(level).trim();
          // 经典 ? / ?? / ???
          if (s === "?" || s === "1" || s === "junior" || s === "Low") return 1;
          if (s === "???" || s === "3" || s === "senior" || s === "High") return 3;
          if (s === "??" || s === "2" || s === "mid" || s === "Mid") return 2;
          // SQL 新树 L0–L6：初级 L0–L1；中级至 L4；高级全开
          const m = /^L(\d+)$/i.exec(s);
          if (m) {
            const n = Number(m[1]);
            if (n <= 1) return 1;
            if (n <= 4) return 2;
            return 3;
          }
          // 兜底：带 sql-L* 的 id 不走这里；未知标记按中级可见
          return 2;
        }
    
        function depthAllows(level) {
          const need = levelRank(level);
          if (depthLevel === "junior") return need <= 1;
          if (depthLevel === "mid") return need <= 2;
          return true;

            const qq = q.trim().toLowerCase();

            const hits = all.filter(x => {
              const blob = (x.title + " " + x.path).toLowerCase();

                if (pathIds.length >= 3) kgDrill.expandedL3 = pathIds[2];
                kgDrill.selectedLeafId = id;
                kgDrill.expandAllL2 = false;
                redrawKgDrill();
                openKgSidePanel(n, isLessonParent(n) ? "chapter" : (kgNodeKids(n).length ? "chapter" : "lesson"));
                updateKgDrillHint();
              });
            });
          };
          input.addEventListener("input", () => renderDrop(input.value));
          input.addEventListener("focus", () => { if (input.value) renderDrop(input.value); });
          document.addEventListener("click", () => drop.classList.remove("open"));

        function fitKgFocusView(duration) {
          if (!kgDrill.active || !satData || !satData.length || typeof zoom === "undefined") return;
          const pad = 88;
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          const hubN = nodeById[kgDrill.hubId];
          if (hubN) {
            minX = maxX = hubN.x; minY = maxY = hubN.y;
          }
          satData.forEach(d => {
            minX = Math.min(minX, d.x); maxX = Math.max(maxX, d.x);
            minY = Math.min(minY, d.y); maxY = Math.max(maxY, d.y);
          });
          const bw = Math.max(140, maxX - minX + pad * 2);
          const bh = Math.max(140, maxY - minY + pad * 2);
          const cx = (minX + maxX) / 2;
          const cy = (minY + maxY) / 2;
          const scale = Math.min(1.85, Math.max(0.42, Math.min(width() / bw, height() / bh) * 0.9));
          const dur = duration == null ? 420 : duration;
          const t = d3.zoomIdentity.translate(width() / 2, height() / 2).scale(scale).translate(-cx, -cy);
          if (dur <= 0) svg.call(zoom.transform, t);
          else svg.transition().duration(dur).ease(d3.easeCubicInOut).call(zoom.transform, t);
        }

        function countKgLessonStats(root) {
          let total = 0, done = 0;
          function walk(n) {
            if (!n) return;
            const kids = n.children || [];
            if (!kids.length) {
              total += 1;
              if (isLearned("kg:" + kgDrill.hubId + ":" + n.id)) done += 1;
              return;
            }
            kids.forEach(walk);
          }
          walk(root);
          return { total, done };
        }

        function flattenKgLeaves(root, out) {
          if (!root) return out || [];
          const acc = out || [];
          const kids = filterKgChildren(root.children || []);
          if (!kids.length) {
            acc.push(root);
            return acc;
          }
          kids.forEach(c => flattenKgLeaves(c, acc));
          return acc;
        }

        function findNextKgLesson(fromId) {
          const tree = currentKgTree();
          if (!tree) return null;
          const leaves = flattenKgLeaves(tree, []);
          if (!leaves.length) return null;
          const idx = leaves.findIndex(n => n.id === fromId);
          // 优先下一未学；否则顺序下一课
          for (let i = Math.max(0, idx + 1); i < leaves.length; i++) {
            const id = "kg:" + kgDrill.hubId + ":" + leaves[i].id;
            if (!isLearned(id)) return leaves[i];
          }
          for (let i = 0; i < leaves.length; i++) {
            const id = "kg:" + kgDrill.hubId + ":" + leaves[i].id;
            if (!isLearned(id) && leaves[i].id !== fromId) return leaves[i];
          }
          if (idx >= 0 && idx + 1 < leaves.length) return leaves[idx + 1];
          return null;
        }

        function jumpToKgLesson(node) {
          if (!node || !kgDrill.active) return;
          pushKgFocusHistory();
          const pathIds = [];
          (function dfs(n, trail) {
            const t = trail.concat(n);
            if (n.id === node.id) { pathIds.push(...t.map(x => x.id)); return true; }
            for (const c of (n.children || [])) if (dfs(c, t)) return true;
            return false;
          })(currentKgTree(), []);
          if (pathIds.length >= 2) kgDrill.expandedL2 = pathIds[1];
          if (pathIds.length >= 3) kgDrill.expandedL3 = pathIds[2];
          kgDrill.selectedLeafId = node.id;
          redrawKgDrill();
          openKgSidePanel(node, isLessonParent(node) ? "chapter" : (kgNodeKids(node).length ? "chapter" : "lesson"));
          updateKgDrillHint();
          setTimeout(() => { if (kgDrill.active) fitKgFocusView(360); }, 100);
          showKgToast("已跳转 · " + node.title);
        }

        function updateNextLessonBtn() {
          const btn = document.getElementById("btnNextLesson");
          if (!btn) return;
          if (!kgDrill.active || !kgDrill.selectedLeafId || kgDrill.panelMode === "empty") {
            btn.classList.remove("is-on");
            btn._nextId = null;
            return;
          }
          const next = findNextKgLesson(kgDrill.selectedLeafId);
          if (!next || next.id === kgDrill.selectedLeafId) {
            btn.classList.remove("is-on");

          btn.title = "下一课：" + next.title;

        function wireNextLessonBtn() {
          const btn = document.getElementById("btnNextLesson");
          if (!btn || btn._bound) return;

        /** 无讲义正文时的兜底 Markdown：标题 + 元数据 + 下级列表，避免空白面板 */
        function buildKgFallbackMd(kgNode) {
          const kids = kgNodeKids(kgNode);
          const title = (kgNode && kgNode.title) || "未命名节点";
          const lines = [
            "### " + title,
            "",
            "_内容建设中_ — 暂无完整讲义，可先浏览下方下级节点或切换深度后再试。",
            "",
            "**节点 ID**：`" + ((kgNode && kgNode.id) || "?") + "`"
          ];
          if (kgNode && kgNode.level) {
            lines.push("**难度**：" + sqlKgLevelLabel(kgNode.level));
          }
          const path = kgPathTitles(kgNode && kgNode.id).filter(Boolean);
          if (path.length) {
            lines.push("**路径**：" + path.join(" / "));
          }
          if (kids.length) {
            lines.push("", "### 下级节点", "");
            kids.forEach((c, i) => {
              const kind = kgNodeKids(c).length ? "目录" : "讲义";
              const lv = c.level ? " · " + sqlKgLevelLabel(c.level) : "";
              lines.push((i + 1) + ". **" + (c.title || c.id) + "**（" + kind + lv + "）");
            });
          } else {
            lines.push("", "> 该节点暂无下级；可返回上级或从左侧路径重新进入。");
          }
          return lines.join("\n");
        }

        function resolveKgPanelMode(kgNode, mode) {

        /** 打开当前学科根节点总览（进入焦点 / 收起至一级时用） */
        function openKgHubOverview() {

        /** 百科同款极角：y 轴向下时用 -sin，使 135°=左上、45°=右上、270°=正下 */
        function polarOffset(ang, r) {
          return { dx: Math.cos(ang) * r, dy: -Math.sin(ang) * r };
        }

        function sectorAngleRad(key) {
          const s = KG_SECTORS[key] || KG_SECTORS.advanced;
          return (s.angDeg * Math.PI) / 180;
        }

        /** 按层级 + 兄弟数计算统一边长（同父同长，消除长短不一） */
        function kgEdgeLen(layer, n) {
          const count = Math.max(1, n || 1);
          // 层越深略短；同层统一边长；整体加长避免压住中心 hub（如 Tableau 压 BI）
          if (layer <= 2) return Math.min(168, 142 + Math.max(0, count - 2) * 6);
          if (layer === 3) return Math.min(108, 88 + Math.max(0, count - 2) * 5);
          return Math.min(86, 68 + Math.max(0, count - 2) * 4);
        }

        /** 扇角随节点数与边长自适应：保证弦长 ≥ 2*节点半径+间距 */
        function kgFanSpread(n, edgeLen, nodeR) {
          if (n <= 1) return 0;
          const pad = 14;
          const minChord = 2 * (nodeR || 18) + pad;
          const r = Math.max(edgeLen || 60, 1);
          const ratio = Math.min(0.98, minChord / (2 * r));
          const step = 2 * Math.asin(ratio);
          const need = step * (n - 1);
          const soft = 0.18 * n;
          return Math.min(1.15, Math.max(soft, need));
        }

        function sectorFanSpread(n) {
          return kgFanSpread(n, kgEdgeLen(2, n), 26);
        }

        function satLabelText(d) {
          const n = d.name || "";
          const max = (d.layer === 2 && (d.sibTotal || 0) >= 4) ? 5
            : (d.layer >= 3 ? 6 : 8);
          return n.length > max ? n.slice(0, max - 1) + "…" : n;
        }

        function applySatLabelLayout(sel) {
          sel.each(function (d) {
            const ang = d.ang != null ? d.ang : -Math.PI / 2;
            const outY = -Math.sin(ang);
            const outX = Math.cos(ang);
            const r = baseSatRadius(d);
            let dy = r + 10;
            let anchor = "middle";
            // 下半球：标签上移，躲开底部状态条
            if (outY > 0.18) {
              dy = -(r + 11);
              anchor = "middle";
            } else if (outX < -0.55) {
              anchor = "end";
            } else if (outX > 0.55) {
              anchor = "start";
            }
            d3.select(this)
              .attr("dy", dy)
              .attr("text-anchor", anchor)
              .attr("x", outY > 0.18 ? 0 : (outX < -0.55 ? -4 : outX > 0.55 ? 4 : 0));
          });
        }

        function assignSectorKey(node, index, total) {
          if (node && node.sector && KG_SECTORS[node.sector]) return node.sector;
          if (node && KG_SECTOR_BY_ID[node.id]) return KG_SECTOR_BY_ID[node.id];
          const rank = levelRank(node && node.level);
          const levels = []; // filled by caller when mixed — fallback thirds
          if (total <= 1) return "advanced";
          // 若调用方传入了多样性，优先用 level；此处默认三等分以形成辐射剪影
          const third = Math.ceil(total / 3) || 1;
          if (index < third) return "foundation";
          if (index < third * 2) return "advanced";
          return "practice";
        }

        function assignSectorKeySmart(nodes) {
          const ranks = nodes.map(n => levelRank(n.level || "??"));
          const uniq = new Set(ranks);
          return nodes.map((n, i) => {
            if (n.sector && KG_SECTORS[n.sector]) return n.sector;
            if (KG_SECTOR_BY_ID[n.id]) return KG_SECTOR_BY_ID[n.id];
            if (uniq.size >= 2) {
              const r = levelRank(n.level || "??");
              if (r <= 1) return "foundation";
              if (r >= 3) return "practice";
              return "advanced";
            }
            return assignSectorKey(n, i, nodes.length);
          });
        }

        /** 行业百科同款 curvedCW：统一顺时针弯，一对多不交叉乱麻 */
        function satArcPath(px, py, x, y, layer, siblingIndex, siblingTotal, parentR, childR) {
          const dx = x - px, dy = y - py;
          const dist = Math.hypot(dx, dy) || 1;
          const pr = parentR != null ? parentR : (layer <= 2 ? hubFocusRadius() : 22);
          const cr = childR != null ? childR : (layer >= 4 ? 15 : layer === 3 ? 17 : 20);
          const gap = 4;
          const sx = px + (dx / dist) * (pr + gap);
          const sy = py + (dy / dist) * (pr + gap);
          const tx = x - (dx / dist) * (cr + gap);
          const ty = y - (dy / dist) * (cr + gap);
          const mx = (sx + tx) / 2;
          const my = (sy + ty) / 2;
          // curvedCW：相对父→子方向取顺时针法向（SVG y 向下）
          const nx = dy / dist;
          const ny = -dx / dist;
          const roundness = layer <= 2 ? 0.24 : 0.30;
          const bend = Math.min(layer <= 2 ? 40 : 30, dist * roundness);
          return `M${sx},${sy}Q${mx + nx * bend},${my + ny * bend} ${tx},${ty}`;
        }

        function hubFocusRadius() {
          return 34;
        }

        function stopKgSettle() {
          if (kgSettleTimer) {
            clearTimeout(kgSettleTimer);
            kgSettleTimer = null;
          }
        }

        function stopKgLiveSim() {
          if (kgLiveSim) {
            kgLiveSim.stop();
            kgLiveSim = null;
          }
          stopKgSettle();
        }

        /** 百科风：几何扇形锁定 + 轻量径向防重叠 */
        /** 对齐行业百科：重建后 Barnes-Hut 式再稳定（整图弹一下再软阻尼） */
        function settleSatPositions(items, hub, animate) {
          if (!items.length) return items;
          stopKgLiveSim();
          const byId = new Map(items.map(d => [d.learnId, d]));
          const reduce = typeof KG_PERF !== "undefined" && KG_PERF.reduceMotion;

          items.forEach(d => {
            if (d.tx == null) d.tx = d.x;
            if (d.ty == null) d.ty = d.y;
            d._r = baseSatRadius(d);
            if (d.parentId && byId.has(d.parentId)) {
              const p = byId.get(d.parentId);
              d.parentX = p.x; d.parentY = p.y;
            } else {
              d.parentX = hub.x; d.parentY = hub.y;
            }
            if (!animate || reduce) {
              d.x = d.tx; d.y = d.ty; d.vx = 0; d.vy = 0;
              return;
            }
            const px = d.parentX != null ? d.parentX : hub.x;
            const py = d.parentY != null ? d.parentY : hub.y;
            if (!d._kept) {
              // 新节点：偏父侧出现 + 向外初速度（像百科新边弹入）
              d.x = px * 0.42 + d.tx * 0.58;
              d.y = py * 0.42 + d.ty * 0.58;
              const ox = d.tx - px, oy = d.ty - py;
              const olen = Math.hypot(ox, oy) || 1;
              d.vx = (ox / olen) * 10;
              d.vy = (oy / olen) * 10;
            } else {
              // 旧节点：轻微扰动，参与整图再稳定（百科 clear+add 后的晃动）
              d.vx = (Math.random() - 0.5) * 3.2;
              d.vy = (Math.random() - 0.5) * 3.2;
            }
          });

          const paint = () => {
            if (satNodeSel) satNodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
            if (satLinkSel) {
              satLinkSel.attr("d", d => satArcPath(d.parentX, d.parentY, d.x, d.y, d.layer, d.sibIdx, d.sibTotal, d.parentR, d._r || baseSatRadius(d)));
            }
            if (typeof updateSatSparks === "function") updateSatSparks();
          };
          paint();
          if (!animate || reduce || typeof d3 === "undefined" || !d3.forceSimulation) return items;

          const springs = items
            .filter(d => d.parentId && byId.has(d.parentId))
            .map(d => {
              const p = byId.get(d.parentId);
              const homeDist = Math.hypot(
                (d.tx != null ? d.tx : d.x) - (p.tx != null ? p.tx : p.x),
                (d.ty != null ? d.ty : d.y) - (p.ty != null ? p.ty : p.y)
              );
              return {
                source: p,
                target: d,
                dist: d._edgeLen != null ? d._edgeLen : (homeDist || kgEdgeLen(d.layer || 3, d.sibTotal || 1))
              };
            });

          // 强钉目标位 + 等长弹簧：保边长一致、防重叠，避免力导向把线拉长短不一
          kgLiveSim = d3.forceSimulation(items)
            .force("charge", d3.forceManyBody().strength(-220).distanceMax(200))
            .force("center", d3.forceCenter(hub.x, hub.y).strength(0.02))
            .force("collide", d3.forceCollide()
              .radius(d => (d._r || 20) + 11)
              .strength(0.95)
              .iterations(3))
            .force("link", d3.forceLink(springs).distance(d => d.dist).strength(0.62))
            .force("x", d3.forceX(d => d.tx).strength(0.48))
            .force("y", d3.forceY(d => d.ty).strength(0.48))
            .velocityDecay(0.55)
            .alpha(0.85)
            .alphaDecay(0.04)
            .alphaMin(0.001);

          let ticks = 0;
          kgLiveSim.on("tick", () => {
            ticks += 1;
            items.forEach(d => {
              if (d.parentId && byId.has(d.parentId)) {
                const p = byId.get(d.parentId);
                d.parentX = p.x; d.parentY = p.y;
              } else {
                d.parentX = hub.x; d.parentY = hub.y;
              }
              // 钉住相对父节点的等长半径，防止力导向把 L2 压进 hub（Tableau 压 BI）
              if (d.parentId && byId.has(d.parentId)) {
                const p = byId.get(d.parentId);
                const targetLen = d._edgeLen != null ? d._edgeLen : kgEdgeLen(d.layer || 3, d.sibTotal || 1);
                const pdx = d.x - p.x, pdy = d.y - p.y;
                const pd = Math.hypot(pdx, pdy) || 1;
                d.x = p.x + (pdx / pd) * targetLen;
                d.y = p.y + (pdy / pd) * targetLen;
              } else {
                const targetLen = d._edgeLen != null ? d._edgeLen : kgEdgeLen(2, d.sibTotal || 1);
                const hubClear = hubFocusRadius() + (d._r || 26) + 28;
                const want = Math.max(targetLen, hubClear);
                const dx = d.x - hub.x, dy = d.y - hub.y;
                const dist = Math.hypot(dx, dy) || 1;
                d.x = hub.x + (dx / dist) * want;
                d.y = hub.y + (dy / dist) * want;
              }
            });
            paint();
            // 百科 stabilizationIterationsDone ≈ 软阻尼，不停死
            if (ticks === 55) {
              kgLiveSim.force("charge", d3.forceManyBody().strength(-120).distanceMax(180));
              kgLiveSim.force("center", d3.forceCenter(hub.x, hub.y).strength(0.01));
              kgLiveSim.force("link", d3.forceLink(springs).distance(d => d.dist).strength(0.45));
              kgLiveSim.force("x", d3.forceX(d => d.tx).strength(0.55));
              kgLiveSim.force("y", d3.forceY(d => d.ty).strength(0.55));
              kgLiveSim.velocityDecay(0.72);
              kgLiveSim.alphaTarget(0.04);
            }
            if (ticks === 120) {
              kgLiveSim.alphaTarget(0.018);
            }
            if (ticks > 220) {
              kgLiveSim.alphaTarget(0);
              if (kgLiveSim.alpha() < 0.012) kgLiveSim.stop();
            }
          });
          return items;
        }

        function baseSatRadius(d) {
          if (d.isLeaf) return 16;
          if (d.isBranch) return 28;
          if (d.isChapter) return 21;
          if (d.layer === 2) return 26;
          if (d.layer === 3) return 18;
          return 16;
        }


        function updateSatSparks() {
          if (!satSparkSel || !satLinkSel) return;
          const pathById = {};
          satLinkSel.each(function (d) { pathById[d.learnId] = this; });
          satSparkSel.each(function (d) {
            const el = pathById[d.learnId];
            if (!el || typeof el.getTotalLength !== "function") return;
            let len = 0;
            try { len = el.getTotalLength(); } catch (e) { return; }
            if (!len) return;
            d._sparkT = ((d._sparkT == null ? Math.random() : d._sparkT) + 0.0075) % 1;
            const pt = el.getPointAtLength(d._sparkT * len);
            d3.select(this).attr("cx", pt.x).attr("cy", pt.y);
          });
        }

        function paintSatSparks(items) {
          if (typeof satSparkG === "undefined") return;
          const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          const sparks = (reduce || (typeof KG_PERF !== 'undefined' && KG_PERF.lowPower)) ? [] : items.filter(d => d.layer === 2).slice(0, 6);
          satSparkSel = satSparkG.selectAll("circle.sat-spark").data(sparks, d => "sp:" + d.learnId)
            .join(
              enter => enter.append("circle")
                .attr("class", "sat-spark")
                .attr("r", 0)
                .attr("fill", d => d.color || "#67e8f9")
                .call(s => s.transition().duration(400).attr("r", 2.3)),
              update => update.attr("fill", d => d.color || "#67e8f9"),
              exit => exit.transition().duration(120).attr("r", 0).remove()
            );
          updateSatSparks();
        }

        function paintSatLayer(items) {
          satData = items;
          const byId = new Map(items.map(d => [d.learnId, d]));

          function refreshHoverClasses() {
            if (!satNodeSel) return;
            const hot = kgHoverId;
            const hotNode = hot ? byId.get(hot) : null;
            const related = new Set();
            if (hotNode) {
              related.add(hot);
              if (hotNode.parentId) related.add(hotNode.parentId);
              items.forEach(d => { if (d.parentId === hot) related.add(d.learnId); });
            }
            satNodeSel
              .classed("is-hot", d => !!hot && d.learnId === hot)
              .classed("is-dimmed", d => !!hot && !related.has(d.learnId));
            if (satLinkSel) {
              satLinkSel
                .classed("is-hot", d => !!hot && (d.learnId === hot || d.parentId === hot || (hotNode && d.learnId === hotNode.parentId)))
                .classed("is-dimmed", d => {
                  if (!hot) return false;
                  return !(d.learnId === hot || d.parentId === hot || (hotNode && (d.learnId === hotNode.parentId || d.parentId === hotNode.parentId)));
                });
            }
          }

          satLinkSel = satLinkG.selectAll("path").data(satData, d => d.learnId)
            .join(
              enter => enter.append("path")
                .attr("class", d => `sat-link layer-${d.layer}${d.layer >= 3 ? " dashed" : ""}`)
                .attr("stroke", d => d.color)
                .attr("marker-end", "url(#arrow-sat)")
                .attr("opacity", 0)
                .call(s => s.transition().duration(d => (typeof KG_PERF !== "undefined" && KG_PERF.reduceMotion) ? 0 : 380).ease(d3.easeCubicOut).attr("opacity", 1)),
              update => update
                .attr("class", d => `sat-link layer-${d.layer}${d.layer >= 3 ? " dashed" : ""}`)
                .attr("stroke", d => d.color),
              exit => exit.transition().duration(160).attr("opacity", 0).remove()
            )
            .attr("d", d => satArcPath(d.parentX, d.parentY, d.x, d.y, d.layer, d.sibIdx, d.sibTotal, d.parentR, d._r || baseSatRadius(d)));

          paintSatSparks(items);

          satNodeSel = satNodeG.selectAll("g").data(satData, d => d.learnId)
            .join(
                            enter => {
                const g = enter.append("g").attr("class", "sat-node entering").attr("opacity", 0);
                g.append("circle").attr("r", 0).attr("stroke", "rgba(255,255,255,0.35)").attr("stroke-width", 2);
                g.append("text").attr("class", "sat-check");
                g.append("text").attr("class", "sat-label");
                g.append("text").attr("class", "sat-sub").attr("dy", 22);
                const reduce = typeof KG_PERF !== "undefined" && KG_PERF.reduceMotion;
                const easePop = (!reduce && typeof d3.easeBackOut === "function")
                  ? d3.easeBackOut.overshoot(2.05)
                  : d3.easeCubicOut;
                // 错开进场：兄弟姐妹依次弹出，更有「爆开」感
                g.transition()
                  .delay(d => reduce ? 0 : Math.min(220, (d.sibIdx || 0) * 28))
                  .duration(d => reduce ? 0 : (d.layer >= 3 ? 560 : 480))
                  .ease(d3.easeCubicOut)
                  .attr("opacity", 1)
                  .on("end", function () { d3.select(this).classed("entering", false); });
                g.select("circle").transition()
                  .delay(d => reduce ? 0 : Math.min(220, (d.sibIdx || 0) * 28))
                  .duration(d => reduce ? 0 : (d.layer >= 3 ? 640 : 560))
                  .ease(easePop)
                  .attr("r", d => baseSatRadius(d) * (d.isBranch ? 1.08 : 1));
                return g;
              },
              update => update.attr("opacity", 1).classed("entering", false),
              exit => exit.transition().duration(140).attr("opacity", 0).remove()
            )
            .attr("transform", d => `translate(${d.x},${d.y})`)
            .attr("class", d => {
              let cls = `sat-node layer-${d.layer}`;
              if (d.isLeaf) cls += " is-leaf";
              if (d.isChapter) cls += " is-chapter";
              if (d.isBranch) cls += " is-branch";
              if (d.sectorKey) cls += " sec-" + d.sectorKey;
              return cls;
            })
            .classed("selected", d => d.kgId === kgDrill.selectedLeafId)
            .classed("learned", d => isLearned(d.learnId));

          satNodeSel.select("circle")
            .attr("fill", d => d.color)
            .style("filter", d => d.sectorGlow
              ? `drop-shadow(0 0 14px ${d.sectorGlow})`
              : null);
          satNodeSel.filter(function () { return !d3.select(this).classed("entering"); })
            .select("circle")
            .attr("r", d => {
              // 百科 hover：约 1.2 倍
              if (kgHoverId && d.learnId === kgHoverId) return baseSatRadius(d) * 1.2;
              if (d.isBranch) return baseSatRadius(d);
              if (d.kgId === kgDrill.selectedLeafId) return baseSatRadius(d) * 1.1;
              return baseSatRadius(d);
            })
            .attr("stroke", d => d.isBranch ? "#fff" : (d.kgId === kgDrill.selectedLeafId ? "rgba(255,255,255,0.75)" : "rgba(255,255,255,0.38)"))
            .attr("stroke-width", d => d.isBranch ? 3 : (d.layer === 2 ? 2.5 : 1.6));

          satNodeSel.select("text.sat-label")
            .text(d => satLabelText(d));
          applySatLabelLayout(satNodeSel.select("text.sat-label"));
          satNodeSel.select("text.sat-sub")
            .text("");
          satNodeSel.select("text.sat-check")
            .text(d => isLearned(d.learnId) ? "✓" : "")
            .attr("dy", d => -(baseSatRadius(d) + 4));

          satNodeSel.on("click", (event, d) => {
            event.stopPropagation();
            const g = d3.select(event.currentTarget);
            g.classed("is-pulse", false);
            void event.currentTarget.offsetWidth;
            g.classed("is-pulse", true);
            setTimeout(() => g.classed("is-pulse", false), 450);
            onKgDrillClick(d);
          });

          satNodeSel.on("mouseenter", function (event, d) {
            kgHoverId = d.learnId;
            refreshHoverClasses();
            showKgNodeTip(d, event);
            d3.select(this).select("circle")
              .transition().duration(140)
              .attr("r", baseSatRadius(d) * 1.22);
          });
          satNodeSel.on("mousemove", function (event, d) {
            showKgNodeTip(d, event);
          });
          satNodeSel.on("mouseleave", function (event, d) {
            if (kgHoverId === d.learnId) kgHoverId = null;
            refreshHoverClasses();
            hideKgNodeTip();
            d3.select(this).select("circle")
              .transition().duration(160)
              .attr("r", d.kgId === kgDrill.selectedLeafId ? baseSatRadius(d) * 1.08 : baseSatRadius(d));
          });

          satNodeSel.call(d3.drag()
            .on("start", (event, d) => {
              event.sourceEvent.stopPropagation();
              hideKgNodeTip();
              if (kgLiveSim) kgLiveSim.alphaTarget(0.35).restart();
              d.fx = d.x; d.fy = d.y;
              d._dragKids = items.filter(n => n.parentId === d.learnId);
              d._dragKids.forEach(k => {
                k._ox = k.x - d.x; k._oy = k.y - d.y;
                k.fx = k.x; k.fy = k.y;
              });
            })
            .on("drag", (event, d) => {
              d.fx = d.x = event.x;
              d.fy = d.y = event.y;
              // 不改 homeX/homeY，松手后回弹到扇区位
              (d._dragKids || []).forEach(k => {
                k.fx = k.x = d.x + (k._ox || 0);
                k.fy = k.y = d.y + (k._oy || 0);
                k.parentX = d.x; k.parentY = d.y;
              });
              items.forEach(n => {
                if (n.parentId && byId.has(n.parentId)) {
                  const p = byId.get(n.parentId);
                  n.parentX = p.x; n.parentY = p.y;
                }
              });
              if (satNodeSel) satNodeSel.attr("transform", n => `translate(${n.x},${n.y})`);
              if (satLinkSel) {
                satLinkSel.attr("d", n => satArcPath(n.parentX, n.parentY, n.x, n.y, n.layer, n.sibIdx, n.sibTotal, n.parentR, n._r || baseSatRadius(n)));
              }
              if (typeof updateSatSparks === "function") updateSatSparks();
            })
            .on("end", (event, d) => {
              d.fx = null; d.fy = null;
              d.tx = d.homeX != null ? d.homeX : d.tx;
              d.ty = d.homeY != null ? d.homeY : d.ty;
              (d._dragKids || []).forEach(k => {
                k.fx = null; k.fy = null;
                k.tx = k.homeX != null ? k.homeX : k.tx;
                k.ty = k.homeY != null ? k.homeY : k.ty;
              });
              d._dragKids = null;
              if (kgLiveSim) {
                kgLiveSim.force("x", d3.forceX(n => n.tx).strength(0.32));
                kgLiveSim.force("y", d3.forceY(n => n.ty).strength(0.32));
                kgLiveSim.alpha(0.55).alphaTarget(0.35).restart();
                setTimeout(() => {
                  if (!kgLiveSim) return;
                  kgLiveSim.force("x", d3.forceX(n => n.tx).strength(0.035));
                  kgLiveSim.force("y", d3.forceY(n => n.ty).strength(0.035));
                  kgLiveSim.alphaTarget(0.018);
                }, 650);
              }
            }));

          refreshHoverClasses();
        }

        function redrawKgDrill() {
          if (!kgDrill.active) return;
          const tree = currentKgTree();
          const hub = nodeById[kgDrill.hubId];
          if (!hub || !tree) return;
          const items = [];
          const prevPos = new Map((satData || []).map(d => [d.learnId, { x: d.x, y: d.y, tx: d.tx, ty: d.ty, homeX: d.homeX, homeY: d.homeY }]));

          function applyPrev(item) {
            const p = prevPos.get(item.learnId);
            if (p) {
              item.x = p.x; item.y = p.y;
              item.tx = p.tx != null ? p.tx : p.x;
              item.ty = p.ty != null ? p.ty : p.y;
              item.homeX = p.homeX != null ? p.homeX : item.tx;
              item.homeY = p.homeY != null ? p.homeY : item.ty;
              item._kept = true;
            } else {
              // 新节点：从父点弹出再 settle 到扇区目标位
              item.tx = item.x; item.ty = item.y;
              item.homeX = item.tx;
              item.homeY = item.ty;
              if (item.parentX != null && item.parentY != null) {
                item.x = item.parentX;
                item.y = item.parentY;
              }
              item._kept = false;
            }
            return item;
          }


          function pushFanAt(c, px, py, x, y, ang, r, layer, idx, total, color, sectorKey, sectorGlow, parentLearnId) {
            const rawKids = kgNodeKids(c);
            const canExpand = filterKgChildren(rawKids).length > 0;
            const isL2Exp = layer === 2 && kgDrill.expandedL2 === c.id;
            const isL3Exp = layer === 3 && kgDrill.expandedL3 === c.id;
            const expanded = isL2Exp || isL3Exp;
            const leaf = !rawKids.length;
            const chapter = isLessonParent(c);
            const sec = KG_SECTORS[sectorKey] || null;
            const fill = leaf
              ? "#34d399"
              : (expanded ? "#f59e0b" : (color || (sec ? sec.color : "#38bdf8")));
            const item = applyPrev({
              learnId: "kg:" + kgDrill.hubId + ":" + c.id,
              kgId: c.id,
              name: c.title,
              x, y,
              parentX: px,
              parentY: py,
              parentId: parentLearnId || null,
              parentR: (layer <= 3 ? 22 : 18),
              layer,
              ang,
              r,
              sibIdx: idx,
              sibTotal: total,
              isLeaf: leaf,
              isChapter: chapter && !leaf,
              isBranch: canExpand && expanded,
              color: fill,
              sectorKey: sectorKey || null,
              sectorGlow: sectorGlow || (sec ? sec.glow : null)
            });
            // 目标位钉死；未保留的节点从父点弹出再弹性落下
            item.tx = x; item.ty = y;
            item.homeX = x; item.homeY = y;
            // 位置交给 settleSatPositions 做弹出；此处只钉目标
            item.x = item._kept ? x : (px * 0.42 + x * 0.58);
            item.y = item._kept ? y : (py * 0.42 + y * 0.58);
            items.push(item);
            return { x: item.x, y: item.y, ang, r, hasKids: canExpand, expanded, leaf, chapter, learnId: item.learnId };
          }

          function pushFan(c, px, py, layer, baseR, idx, total, parentAng, color, sectorKey, sectorGlow, parentLearnId) {
            let ang;
            if (total <= 1) {
              ang = (parentAng != null) ? parentAng : sectorAngleRad(sectorKey || "advanced");
            } else if (parentAng != null) {
              const edge = (typeof kgEdgeLen === "function") ? kgEdgeLen(layer, total) : baseR;
              const nodeR = layer <= 2 ? 26 : (layer === 3 ? 18 : 16);
              const fan = (typeof kgFanSpread === "function")
                ? kgFanSpread(total, edge, nodeR)
                : sectorFanSpread(total);
              ang = total === 1 ? parentAng : parentAng - fan / 2 + (fan * idx) / Math.max(total - 1, 1);
            } else {
              ang = -Math.PI / 2;
            }
            const r = (typeof kgEdgeLen === "function") ? kgEdgeLen(layer, total) : baseR;
            const off = polarOffset(ang, r);
            const x = px + off.dx;
            const y = py + off.dy;
            const rawKids = kgNodeKids(c);
            const canExpand = filterKgChildren(rawKids).length > 0;
            const isL2Exp = layer === 2 && kgDrill.expandedL2 === c.id;
            const isL3Exp = layer === 3 && kgDrill.expandedL3 === c.id;
            const expanded = isL2Exp || isL3Exp;
            const leaf = !rawKids.length;
            const chapter = isLessonParent(c);
            const sec = KG_SECTORS[sectorKey] || null;
            const fill = leaf
              ? "#34d399"
              : (expanded ? "#f59e0b" : (color || (sec ? sec.color : "#38bdf8")));
            const item = applyPrev({
              learnId: "kg:" + kgDrill.hubId + ":" + c.id,
              kgId: c.id,
              name: c.title,
              x, y,
              parentX: px,
              parentY: py,
              parentId: parentLearnId || null,
              parentR: (layer <= 3 ? 22 : 18),
              layer,
              ang,
              r,
              sibIdx: idx,
              sibTotal: total,
              isLeaf: leaf,
              isChapter: chapter && !leaf,
              isBranch: canExpand && expanded,
              color: fill,
              sectorKey: sectorKey || null,
              sectorGlow: sectorGlow || (sec ? sec.glow : null)
            });
            items.push(item);
            return { x: item.x, y: item.y, ang, r, hasKids: canExpand, expanded, leaf, chapter, learnId: item.learnId };
          }

          if (kgDrill.revealed) {
            const l2s = filterKgChildren(tree.children || []);
            const edge2Global = kgEdgeLen(2, l2s.length);
            const sectorKeys = assignSectorKeySmart(l2s);
            const groups = { foundation: [], advanced: [], practice: [] };
            l2s.forEach((c, i) => {
              const key = sectorKeys[i] || "advanced";
              groups[key] = groups[key] || [];
              groups[key].push({ node: c, sectorKey: key });
            });
            KG_SECTOR_ORDER.forEach((key) => {
              const full = groups[key] || [];
              if (!full.length) return;
              const limit = (kgShowMore && kgShowMore[key]) || full.length;
              const list = full.slice(0, Math.min(limit, full.length));
              const sec = KG_SECTORS[key];
              const base = sectorAngleRad(key);
              const n = list.length;
              const edge2 = edge2Global;
              const spread = kgFanSpread(n, edge2, 26);
              list.forEach((entry, i) => {
                const c = entry.node;
                const ang = n === 1 ? base : base - spread / 2 + (spread * i) / Math.max(n - 1, 1);
                // 同扇区同半径：边长统一，无错层 jitter
                const baseR = edge2;
                const off = polarOffset(ang, baseR);
                const placed = {
                  x: hub.x + off.dx,
                  y: hub.y + off.dy,
                  ang,
                  r: baseR
                };
                // push via shared item builder (manual parent = hub)
                const rawKids = kgNodeKids(c);
                const canExpand = filterKgChildren(rawKids).length > 0;
                // 仅当前选中的一级展开其二级；其它一级不带二级
                const expanded = kgDrill.expandedL2 === c.id;
                const leaf = !rawKids.length;
                const chapter = isLessonParent(c);
                items.push(applyPrev({
                  learnId: "kg:" + kgDrill.hubId + ":" + c.id,
                  kgId: c.id,
                  name: c.title,
                  x: placed.x,
                  y: placed.y,
                  parentX: hub.x,
                  parentY: hub.y,
                  parentId: null,
                  parentR: hubFocusRadius(),
                  layer: 2,
                  ang: placed.ang,
                  r: placed.r,
                  sibIdx: i,
                  sibTotal: n,
                  isLeaf: leaf,
                  isChapter: chapter && !leaf,
                  isBranch: canExpand && expanded,
                  color: leaf ? "#34d399" : (expanded ? "#f59e0b" : sec.color),
                  sectorKey: key,
                  sectorGlow: sec.glow
                }));
                const l2Node = items[items.length - 1];
                l2Node.tx = placed.x; l2Node.ty = placed.y;
                l2Node.homeX = placed.x; l2Node.homeY = placed.y;
                l2Node.ang = placed.ang; l2Node.r = placed.r;
                l2Node._edgeLen = baseR;
                if (l2Node._kept) {
                  l2Node.x = placed.x; l2Node.y = placed.y;
                } else {
                  l2Node.x = hub.x * 0.42 + placed.x * 0.58;
                  l2Node.y = hub.y * 0.42 + placed.y * 0.58;
                  l2Node.parentX = hub.x; l2Node.parentY = hub.y;
                }
                // 仅 expandedL2 对应一级带出二级主题
                if (expanded && canExpand) {
                  const l3All = filterKgChildren(c.children || []);
                  const l3s = l3All.slice(0, kgShowMoreL3 || l3All.length);
                  const n3 = l3s.length;
                  // 相对父节点等长扇出：同父边长一致，扇角随节点数自适应
                  const edge3 = kgEdgeLen(3, n3);
                  const fan3 = kgFanSpread(n3, edge3, 18);
                  const l2x = l2Node.homeX != null ? l2Node.homeX : l2Node.tx;
                  const l2y = l2Node.homeY != null ? l2Node.homeY : l2Node.ty;
                  l3s.forEach((c3, j) => {
                    const ang3 = n3 === 1 ? l2Node.ang : l2Node.ang - fan3 / 2 + (fan3 * j) / Math.max(n3 - 1, 1);
                    const off3 = polarOffset(ang3, edge3);
                    const x3 = l2x + off3.dx;
                    const y3 = l2y + off3.dy;
                    const p3 = pushFanAt(c3, l2x, l2y, x3, y3, ang3, edge3, 3, j, n3, sec.color, key, sec.glow, l2Node.learnId);
                    const l3Item = items[items.length - 1];
                    if (l3Item) l3Item._edgeLen = edge3;
                    if (kgDrill.expandedL3 === c3.id && p3.hasKids) {
                      const l4s = filterKgChildren(c3.children || []);
                      const n4 = l4s.length;
                      const edge4 = kgEdgeLen(4, n4);
                      const fan4 = kgFanSpread(n4, edge4, 16);
                      l4s.forEach((c4, k) => {
                        const ang4 = n4 === 1 ? ang3 : ang3 - fan4 / 2 + (fan4 * k) / Math.max(n4 - 1, 1);
                        const off4 = polarOffset(ang4, edge4);
                        const x4 = x3 + off4.dx;
                        const y4 = y3 + off4.dy;
                        pushFanAt(c4, x3, y3, x4, y4, ang4, edge4, 4, k, n4, sec.color, key, sec.glow, p3.learnId);
                        const l4Item = items[items.length - 1];
                        if (l4Item) l4Item._edgeLen = edge4;
                      });
                    }
                  });
                }
              });
            });
          }

          paintSatLayer(items);
          settleSatPositions(items, hub, true);
          syncKgHubSize();
          updateKgDrillHint();
          updateKgFocusChrome();
        }

        function revealKgPanelContent(kg, mode) {
          if (!kg || !panel) return;
          const visible = panel.classList.contains("open")
            && panel.classList.contains("side-mode")
            && !document.body.classList.contains("is-panel-collapsed");
          if (!visible) return;
          openKgSidePanel(kg, mode, { preserveLayout: true });
        }

        function onKgDrillClick(sat) {
          const kg = findKgNode(sat.kgId);
          if (!kg) return;
          const kids = filterKgChildren(kgNodeKids(kg));
          const rawKids = kgNodeKids(kg);
          pushKgFocusHistory();

          // 画布点击只展开/收起节点，不开关、不缩放右侧弹窗
          if (!rawKids.length) {
            kgDrill.selectedLeafId = kg.id;
            redrawKgDrill();
            revealKgPanelContent(kg, "lesson");
            return;
          }
    
          if (sat.layer === 2) {
            if (kgDrill.expandedL2 === kg.id) {
              kgDrill.expandedL2 = null;
              kgDrill.expandedL3 = null;
            } else {
              kgDrill.expandedL2 = kg.id;
              kgDrill.expandedL3 = null;
            }
            kgDrill.selectedLeafId = kg.id;
            redrawKgDrill();
            revealKgPanelContent(kg, "chapter");
            return;
          }
    
          if (sat.layer === 3) {
            if (!kids.length && rawKids.length) {
              kgDrill.expandedL3 = kg.id;
              kgDrill.selectedLeafId = kg.id;
              redrawKgDrill();
              revealKgPanelContent(kg, "chapter");
              return;
            }
            if (isLessonParent(kg)) {
              if (kgDrill.expandedL3 !== kg.id) kgDrill.expandedL3 = kg.id;
              kgDrill.selectedLeafId = kg.id;
              redrawKgDrill();
              revealKgPanelContent(kg, "chapter");
              return;
            }
            if (kgDrill.expandedL3 === kg.id) {
              kgDrill.expandedL3 = null;
            } else {
              kgDrill.expandedL3 = kg.id;
            }
            kgDrill.selectedLeafId = kg.id;
            redrawKgDrill();
            revealKgPanelContent(kg, "chapter");
            return;
          }
    
          kgDrill.selectedLeafId = kg.id;
          redrawKgDrill();
          revealKgPanelContent(kg, rawKids.length ? "chapter" : "lesson");
        }

        function clearSatellites() {
      expandedHubId = null;
      if (typeof stopKgPulse === "function") stopKgPulse();
      if (typeof stopKgLiveSim === "function") stopKgLiveSim();
      else if (typeof stopKgSettle === "function") stopKgSettle();
      if (kgDrill && kgDrill.active) exitKgDrill();
      satData = [];
      satLinkG.selectAll("*").remove();
      if (typeof satSparkG !== "undefined") satSparkG.selectAll("*").remove();
      satNodeG.selectAll("*").remove();
      satNodeSel = null;
      satLinkSel = null;
      satSparkSel = null;
      node.classed("hub-expanded", false);
      syncKgHubSize();
    }

    function redrawSatellites() {
      if (kgDrill && kgDrill.active) {
        redrawKgDrill();
        return;
      }
      if (!expandedHubId) return;
      const hub = nodeById[expandedHubId];
      if (!hub || !hub.engines) { clearSatellites(); return; }
      const nEng = hub.engines.length;
      const R = Math.min(155, 72 + nEng * 8);
      satData = hub.engines.map((e, i) => {
        const ang = -Math.PI / 2 + (i / nEng) * Math.PI * 2;
        return {
          learnId: hub.id + ":" + e.id,
          engineId: e.id,
          hubId: hub.id,
          name: e.name,
          x: hub.x + Math.cos(ang) * R,
          y: hub.y + Math.sin(ang) * R,
          color: CATEGORIES[hub.category].color
        };
      });
      satLinkSel = satLinkG.selectAll("path").data(satData, d => d.learnId)
        .join("path")
        .attr("class", "sat-link")
        .attr("stroke", d => d.color)
        .attr("d", d => satArcPath(hub.x, hub.y, d.x, d.y, 2, 0, nEng));
      satNodeSel = satNodeG.selectAll("g").data(satData, d => d.learnId)
        .join(enter => {
          const g = enter.append("g").attr("class", "sat-node");
          g.append("circle").attr("r", 20);
          g.append("text").attr("class", "sat-label");
          return g;
        })
        .attr("transform", d => `translate(${d.x},${d.y})`)
        .classed("learned", d => isLearned(d.learnId))
        .classed("selected", d => panelState.engineId === d.engineId);
      satNodeSel.select("circle").attr("fill", d => d.color);
      satNodeSel.select("text").text(d => d.name.length > 6 ? d.name.slice(0, 5) + "…" : d.name);
      satNodeSel.on("click", (event, d) => {
        event.stopPropagation();
        openSatellite(d);
      });
      node.classed("hub-expanded", n => n.id === expandedHubId);
    }

    function expandCatalog(hub) {
      // 教程树学科不再展开引擎卫星环，避免看起来像「百科弹窗」
      if (typeof KG_TREES !== "undefined" && hub && (typeof hasKgCurriculum === 'function' ? hasKgCurriculum(hub.id) : KG_TREES[hub.id])) {
        clearSatellites();
        return;
      }
      if (!hub.catalog || !hub.engines || !hub.engines.length) {
        clearSatellites();
        return;
      }
      expandedHubId = hub.id;
      redrawSatellites();
    }

    function openSatellite(sat) {
      const hub = nodeById[sat.hubId];
      if (!hub) return;
      if (typeof KG_TREES !== "undefined" && (typeof hasKgCurriculum === 'function' ? hasKgCurriculum(hub.id) : KG_TREES[hub.id]) && typeof enterKgDrill === "function") {
        enterKgDrill(hub.id);
        return;
      }
      selectedId = hub.id;
      panelState = { mode: "engine", engineId: sat.engineId, compareOn: false, compareIds: [] };
      const related = neighbors[hub.id] || new Set();
      node.classed("selected", n => n.id === hub.id)
        .classed("related", n => related.has(n.id))
        .classed("dimmed", n => n.id !== hub.id && !related.has(n.id));
      link.classed("active", l => l.source.id === hub.id || l.target.id === hub.id)
        .classed("dimmed", l => l.source.id !== hub.id && l.target.id !== hub.id)
        .attr("marker-end", l =>
          (l.source.id === hub.id || l.target.id === hub.id) ? "url(#arrow-active)" : "url(#arrow)");
      renderPanel(hub);
      redrawSatellites();
    }

    node.on("click", (event, d) => {
      event.stopPropagation();
      panelState = { mode: "overview", engineId: null, compareOn: false, compareIds: [] };
      if ((typeof hasKgCurriculum === 'function' ? hasKgCurriculum(d.id) : KG_TREES[d.id])) {
        // 行业百科式：进入焦点即展开三扇区（知识图谱），不打开引擎目录弹窗
        selectedId = d.id;
        const related = neighbors[d.id] || new Set();
        node.classed("selected", n => n.id === d.id)
          .classed("related", n => related.has(n.id))
          .classed("dimmed", n => n.id !== d.id && !related.has(n.id));
        link.classed("active", l => l.source.id === d.id || l.target.id === d.id)
          .classed("dimmed", l => l.source.id !== d.id && l.target.id !== d.id)
          .attr("marker-end", l =>
            (l.source.id === d.id || l.target.id === d.id) ? "url(#arrow-active)" : "url(#arrow)");
        if (kgDrill.active && kgDrill.hubId === d.id) {
          if (!kgDrill.revealed) {
            kgDrill.revealed = true;
            redrawKgDrill();
          } else if (kgDrill.expandedL2 || kgDrill.expandedL3 || (kgDrill.panelMode && kgDrill.panelMode !== "empty")) {
            collapseKgToL1();
          }
          updateKgDrillHint();
          syncKgHubSize();
        } else {
          enterKgDrill(d.id);
        }
        syncLearnedUI();
        return;
      }
      if (kgDrill && kgDrill.active) exitKgDrill();
      panelState = { mode: d.catalog ? "list" : "overview", engineId: null, compareOn: false, compareIds: [] };
      selectNode(d);
      if (d.catalog) expandCatalog(d);
      else clearSatellites();
    });
    svg.on("click", (event) => {
      // 焦点模式：单击空白不退出（避免误触）；双击收起二级
      if (kgDrill && kgDrill.active) return;
      clearSatellites();
      closePanel();
    });
    svg.on("dblclick", (event) => {
      if (!(kgDrill && kgDrill.active)) return;
      event.preventDefault();
      event.stopPropagation();
      collapseKgToL1();
    });

    function tick() {
      link.attr("d", linkPath);
      node.attr("transform", d => `translate(${d.x},${d.y})`);
      // 焦点模式下禁止整图重绘（会把卫星 opacity 卡死 / 打断进场）
      if (kgDrill && kgDrill.active) return;
      if (expandedHubId) redrawSatellites();
    }

    function applyLinkVisibility() {
      link.classed("hidden", false)
        .attr("marker-end", d => "url(#arrow)");
      if (!selectedId) {
        link.classed("active", false).classed("dimmed", false);
      }
    }

    function selectNode(d) {
      selectedId = d.id;
      const related = neighbors[d.id] || new Set();
      node.classed("selected", n => n.id === d.id)
        .classed("related", n => related.has(n.id))
        .classed("dimmed", n => n.id !== d.id && !related.has(n.id));
      link.classed("hidden", false)
        .classed("active", l => l.source.id === d.id || l.target.id === d.id)
        .classed("dimmed", l => l.source.id !== d.id && l.target.id !== d.id)
        .attr("marker-end", l =>
          (l.source.id === d.id || l.target.id === d.id) ? "url(#arrow-active)" : "url(#arrow)");
      renderPanel(d);
    }

    function resetHighlight() {
      selectedId = null;
      node.classed("selected", false).classed("related", false).classed("dimmed", false).classed("hub-expanded", false);
      applyLinkVisibility();
      syncLearnedUI();
      tick();
    }

    function setDepth(level) {
      depthLevel = level;
      document.getElementById("btnDepthJunior").classList.toggle("active", level === "junior");
      document.getElementById("btnDepthMid").classList.toggle("active", level === "mid");
      document.getElementById("btnDepthSenior").classList.toggle("active", level === "senior");
      if (kgDrill && kgDrill.active) {
        // 深度过滤知识树可见节点；已展开但被滤掉的分支自动收起
        redrawKgDrill();
        if (kgDrill.selectedLeafId) {
          const cur = findKgNode(kgDrill.selectedLeafId);
          if (cur) openKgSidePanel(cur, kgDrill.panelMode || (isLessonParent(cur) ? "chapter" : "lesson"));
        }
        return;
      }
      if (selectedId) {
        const n = nodes.find(x => x.id === selectedId);
        if (n) renderPanel(n);
      }
    }
    document.getElementById("btnDepthJunior").addEventListener("click", () => setDepth("junior"));
    document.getElementById("btnDepthMid").addEventListener("click", () => setDepth("mid"));
    document.getElementById("btnDepthSenior").addEventListener("click", () => setDepth("senior"));

    function relayout() {
      const m = placeNodes();
      drawStages(m);
      tick();
      if (kgDrill && kgDrill.active) {
        svg.call(zoom.transform, d3.zoomIdentity);
        if (typeof fitKgFocusView === "function" && satData && satData.length) {
          fitKgFocusView(0);
        }
        return;
      }
      const scale = Math.min(1, width() / m.w, height() / m.h);
      const tx = (width() - m.w * scale) / 2;
      const ty = (height() - m.h * scale) / 2;
      svg.call(zoom.transform, d3.zoomIdentity.translate(Math.max(0, tx), Math.max(0, ty)).scale(scale < 1 ? scale : 1));
    }


    function wireHomeHotEntries() {
      const box = document.getElementById("homeHot");
      if (!box || box._bound) return;
      box._bound = true;
      const hubEntries = [
        { hub: "sql", label: "SQL" },
        { hub: "python", label: "Python" },
        { hub: "database", label: "数据库" },
        { hub: "ml", label: "机器学习" },
        { hub: "etl", label: "ETL" },
        { hub: "dwh", label: "数据仓库" },
        { hub: "bi", label: "BI" }
      ];
      box.innerHTML = hubEntries.map(e =>
        `<button type="button" data-hub="${e.hub}">${e.label}</button>`
      ).join("");
      box.querySelectorAll("[data-hub]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const hub = btn.getAttribute("data-hub");
          if (!(typeof hasKgCurriculum === 'function' ? hasKgCurriculum(hub) : KG_TREES[hub])) {
            showKgToast("该学科教程尚未挂载");
            return;
          }
          enterKgDrill(hub);
          showKgToast("已进入「" + (btn.textContent || hub) + "」知识图谱");
        });
      });
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", wireHomeHotEntries);
    } else {
      // deferred: call after KG fns exist — hooked near relayout end
    }

    wireHomeHotEntries();
    let __kgResizeTimer = 0;
    window.addEventListener("resize", () => {
      clearTimeout(__kgResizeTimer);
      __kgResizeTimer = setTimeout(() => { try { relayout(); } catch (_) {} }, 120);
    });
    applyLinkVisibility();
    syncLearnedUI();
    tick();
    relayout();
    if (typeof prefetchKgTreesIdle === "function") prefetchKgTreesIdle();

  </script>
</body>
</html>
